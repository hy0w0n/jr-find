# H2 파일 DB (프로젝트 폴더 아래 data/ 에 생성됨, git 제외)
# 다른 DB를 쓰려면 환경변수 SPRING_DATASOURCE_URL / USERNAME / PASSWORD 로 덮어쓴다.
spring.datasource.url=jdbc:h2:file:./data/jrfinddb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 기동 시 schema.sql(테이블) / data.sql(노선·역·카테고리) 실행
spring.sql.init.mode=always

# H2 콘솔 (개발용). 기본은 꺼 두고, 필요할 때 환경변수 JRFIND_H2_CONSOLE=true 로 켠다 (켜도 localhost 에서만 접속 가능)
spring.h2.console.enabled=${JRFIND_H2_CONSOLE:false}
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
# 화면을 끝까지 만든 뒤에 한 번에 보낸다.
# 로그인 전 첫 방문(세션 없음)에 화면 중간의 폼에서 CSRF 토큰(세션에 저장)을 처음 만들면,
# 이미 보내기 시작한 응답에는 세션 쿠키를 붙일 수 없어 화면이 중간에 끊긴다 (見つけた 등록 화면 등)
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# 업로드 이미지 저장 폴더 (git 제외). 환경변수 JRFIND_UPLOAD_DIR 로 변경 가능
jrfind.upload-dir=${JRFIND_UPLOAD_DIR:./uploads}

# 파일 하나의 최대 크기 (기본 1MB -> 10MB로 증량)
spring.servlet.multipart.max-file-size=10MB

# 요청 전체의 최대 크기 (여러 파일 합산 등)
spring.servlet.multipart.max-request-size=10MB

# multipart 요청 한 번에 받는 칸 수 (기본 10개: 見つけた 등록 폼이 이미 10칸이라 하나만 늘어도 413 오류가 났다)
server.tomcat.max-part-count=20

# 다른 사이트에서 보낸 POST 요청에 세션 쿠키가 붙지 않도록 (CSRF 완화)
server.servlet.session.cookie.same-site=lax
# 세션 ID를 URL(;jsessionid=...)에 붙이지 않고 쿠키로만 주고받는다
server.servlet.session.tracking-modes=cookie
