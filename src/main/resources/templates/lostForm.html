<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item == null} ? 'JR-Find | 探しています 投稿' : 'JR-Find | 探しています 編集'">JR-Find | 探しています 投稿</title>
    <link rel="stylesheet" th:href="@{/webjars/flatpickr/dist/flatpickr.min.css}">
    <!-- 등록·수정 화면 공통 스타일 (見つけた 등록·수정과 같이 사용) -->
    <link rel="stylesheet" th:href="@{/css/post-form.css}">
    <script th:src="@{/js/js-enabled.js}"></script>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 위 스타일 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <main class="container">
        <div class="form-header">
            <h1 class="form-title" th:text="${item == null} ? '探しています 投稿' : '探しています 編集'">探しています 投稿</h1>
            <div class="action-btns">
                <a th:href="${item == null} ? @{/lost-items} : @{/lost-items/{id}(id=${item.id})}" id="btnCancel" class="btn">キャンセル</a>
                <button type="submit" form="lostForm" class="btn btn-submit" th:text="${item == null} ? '登録' : '保存'">登録</button>
            </div>
        </div>

        <!-- 작성 전 주의사항 (사기·절도 경고). 확인해야 작성할 수 있다 (서버에서도 확인)
             JS 가 켜져 있으면 처음에 창으로 띄우고, 꺼져 있으면 폼 위에 그대로 보인다 (체크 = warningConfirmed) -->
        <section id="warningModal" class="warning-section" th:if="${item == null}">
            <div class="warning-box">
                <h2 class="warning-title" id="warningTitle">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12.8659 3.00017L22.3922 19.5002C22.6684 19.9785 22.5045 20.5901 22.0262 20.8662C21.8742 20.954 21.7017 21.0002 21.5262 21.0002H2.47363C1.92135 21.0002 1.47363 20.5525 1.47363 20.0002C1.47363 19.8246 1.51984 19.6522 1.60761 19.5002L11.1339 3.00017C11.41 2.52187 12.0216 2.358 12.4999 2.63414C12.6519 2.72191 12.7782 2.84815 12.8659 3.00017ZM4.20568 19.0002H19.7941L11.9999 5.50017L4.20568 19.0002ZM10.9999 16.0002H12.9999V18.0002H10.9999V16.0002ZM10.9999 9.00017H12.9999V14.0002H10.9999V9.00017Z"></path></svg>
                    投稿の前に必ずお読みください
                </h2>
                <ul class="warning-list">
                    <li>他人の忘れ物を<b>自分の物だと偽って受け取る行為は、詐欺罪</b>にあたります。</li>
                    <li>他人の物を<b>持ち去ったり、自分の物にしたりする行為は、窃盗罪・遺失物等横領罪</b>にあたります。</li>
                    <li>忘れ物の受け取りは、駅のお忘れ物承り所または警察を通して行ってください。<br>個人間での直接の受け渡しや、金銭の要求には応じないでください。</li>
                </ul>
                <label class="warning-check">
                    <input type="checkbox" id="warningCheck" name="warningConfirmed" value="true" form="lostForm" th:checked="${warningConfirmed == true}"> 上記の内容を確認しました
                </label>
                <div class="modal-btn-group warning-actions">
                    <a class="modal-btn modal-btn-cancel" th:href="@{/lost-items}">戻る</a>
                    <button type="button" class="modal-btn modal-btn-ok" id="warningOkBtn">投稿へ進む</button>
                </div>
            </div>
        </section>

        <!-- 서버 검증에서 걸린 경우, 보내지 못한 입력을 다시 채운 경우 (JS 가 켜져 있으면 창으로 보여 준다) -->
        <div id="serverError" class="form-error" role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

        <!-- 입력 오류로 돌아와도 입력값은 th:field 로 유지된다. 확인·편의 기능은 js/post-form.js -->
        <form id="lostForm" class="post-form" th:object="${form}" method="post" enctype="multipart/form-data"
              th:action="${item == null} ? @{/lost-items/new} : @{/lost-items/{id}/edit(id=${item.id})}"
              th:data-dirty="${errorMessage != null}">

            <th:block th:if="${item != null}">
                <!-- 입력 오류로 다시 열린 경우에도 지운 사진은 지운 상태 그대로 -->
                <input type="hidden" id="isImageDeleted" name="isImageDeleted" th:value="${isImageDeleted == true}">
            </th:block>

            <div class="form-row">
                <label class="form-label" for="autoTitle">タイトル</label>
                <div class="form-input">
                    <input type="text" id="autoTitle" class="input-readonly input-title" readonly aria-describedby="titleHint">
                    <span id="titleHint" class="visually-hidden">日付・場所・なくした物から自動で作られます。</span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="lostDate">なくした日</label>
                <div class="form-input">
                    <div class="date-input-wrapper">
                        <input type="text" id="lostDate" th:field="*{lostDate}" class="date-input" placeholder="年-月-日"
                               autocomplete="off" aria-describedby="dateHint" data-required="なくした日を入力してください。">
                        <svg class="calendar-icon-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9 1V3H15V1H17V3H21C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3H7V1H9ZM20 11H4V19H20V11ZM7 5H4V9H20V5H17V7H15V5H9V7H7V5Z"></path></svg>
                    </div>
                    <span class="hint" id="dateHint">例: 2026-01-10。はっきりしない場合は、だいたいの日付で構いません。</span>
                </div>
            </div>

            <div class="form-row" role="group" aria-labelledby="placeLabel">
                <span class="form-label" id="placeLabel">なくした場所</span>
                <div class="form-input">
                    <select id="lineSelect" th:field="*{lineName}" class="select-line" aria-label="なくした路線" data-required="路線を選択してください。">
                        <option value="">路線を選択</option>
                        <option th:each="line : ${lines}" th:value="${line}" th:text="${line}"></option>
                    </select>
                    <!-- 노선을 고르면 그 노선의 역만 보인다 (data-line). 「駅がわからない」의 값은 LostItemForm.UNKNOWN_STATION -->
                    <select id="stationSelect" name="stationName" class="select-station-wide" aria-label="なくした駅"
                            data-required="駅を選択してください。&#10;(わからない場合は「駅がわからない」)">
                        <option value="">駅を選択</option>
                        <option value="unknown" th:selected="${form.stationName == 'unknown'}">駅がわからない</option>
                        <option th:each="st : ${stations}" th:value="${st.stationName}" th:text="${st.stationName}" th:data-line="${st.lineName}"
                                th:selected="${st.lineName == form.lineName and st.stationName == form.stationName}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row" role="group" aria-labelledby="itemLabel">
                <span class="form-label" id="itemLabel">なくした物</span>
                <div class="form-input">
                    <select id="categorySelect" th:field="*{categoryName}" class="select-category" aria-label="なくした物のカテゴリー" data-required="カテゴリーを選択してください。">
                        <option value="">カテゴリー</option>
                        <option th:each="cat : ${categories}" th:value="${cat.categoryName}" th:text="${cat.categoryName}"></option>
                    </select>
                    <input type="text" id="itemName" th:field="*{itemName}" class="input-item" maxlength="100" placeholder="具体的な物 (例: 黒い長財布)"
                           aria-label="具体的な物" data-required="具体的な物を入力してください。">
                </div>
            </div>

            <div class="detail-row">
                <label class="form-label" for="contents">詳細</label>
                <div class="detail-content">
                    <textarea id="contents" th:field="*{contents}" class="detail-text" maxlength="500" data-required="詳細を入力してください。"
                              placeholder="なくした時の状況や場所、物の見た目などを書いてください。&#10;※ 中身や目印など、ご本人にしか分からない特徴は書かずに残しておくと、受け取りの際の確認に役立ちます。"></textarea>

                    <!-- 사진: 파일 칸은 숨기고 영역 전체를 그 칸의 label 로 (키보드는 파일 칸에 Tab → Enter) -->
                    <div class="detail-image-upload">
                        <input type="file" id="fileInput" name="imageFile" class="file-input" accept="image/jpeg,image/png,image/gif,image/webp"
                               aria-label="写真を選ぶ（任意）" aria-describedby="uploadHint">
                        <label for="fileInput" class="upload-label">
                            <span id="uploadPlaceholder" th:hidden="${item != null and item.imgPath != null}">
                                <svg class="image-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15V18H24V20H21V23H19V20H16V18H19V15H21ZM21.0082 3C21.556 3 22 3.44495 22 3.9934V13H20V5H4V18.999L14 9L17 12V14.829L14 11.8284L6.827 19H14V21H2.9918C2.44405 21 2 20.5551 2 20.0066V3.9934C2 3.44476 2.45531 3 2.9918 3H21.0082ZM8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7Z"></path></svg>
                                <span class="upload-placeholder" id="uploadHint">同じ物の写真や、<br>身につけていた時の写真があれば<br>追加してください。</span>
                            </span>
                        </label>
                        <img id="imagePreview" class="image-preview" th:alt="${item != null} ? '投稿の画像' : '選択した画像'"
                             th:src="${item != null and item.imgPath != null} ? |/images/${item.imgPath}| : null"
                             th:hidden="${item == null or item.imgPath == null}">
                        <button type="button" class="delete-img-btn" id="deleteImgBtn" aria-label="写真を削除" th:hidden="${item == null or item.imgPath == null}">✕</button>
                    </div>
                </div>
            </div>

            <div class="form-row form-row-last">
                <span class="form-label">投稿者</span>
                <div class="form-input">
                    <span class="author-name" th:text="${item == null} ? ${loginMember.nickname} : ${item.author}">ニックネーム</span>
                </div>
            </div>
        </form>
    </main>

    <!-- 안내·확인 창 (js/post-form.js) -->
    <div id="customModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalMessage">
        <div class="modal-box">
            <svg class="modal-icon-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"></path></svg>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-btn-group">
                <button type="button" class="modal-btn modal-btn-cancel" id="modalCancelBtn" hidden>キャンセル</button>
                <button type="button" class="modal-btn modal-btn-ok" id="modalOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/flatpickr/dist/flatpickr.min.js}"></script>
    <script th:src="@{/webjars/flatpickr/dist/l10n/ja.js}"></script>
    <!-- 직접 입력한 날짜 확인 (형식이 틀린 날짜를 다른 날짜로 바꾸지 않게) -->
    <script th:src="@{/js/date-input.js}"></script>
    <script th:src="@{/js/dialog.js}"></script>
    <script th:src="@{/js/post-form.js}"></script>
</body>
</html>
