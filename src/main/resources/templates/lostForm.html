<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item == null} ? 'JR-Find | 探しています 投稿' : 'JR-Find | 探しています 編集'">JR-Find | 探しています 投稿</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 1000px; margin: 30px auto; }

        /* 헤더 및 버튼 (見つけた 등록 화면과 같은 모양) */
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .action-btns { display: flex; gap: 10px; }
        .btn { padding: 8px 25px; border-radius: 20px; border: 1px solid #ccc; cursor: pointer; font-size: 14px; font-family: inherit; text-decoration: none; color: #333; transition: all 0.2s; }
        .btn-cancel { background: #f0f0f0; }
        .btn-submit { background: #f0f0f0; color: #e63946; font-weight: bold; }
        .btn:hover { background: #e5e5e5; }

        .form-row { display: flex; border-bottom: 1px solid #eee; align-items: center; min-height: 70px; }
        .form-label { width: 200px; padding: 20px; font-weight: bold; }
        .form-input { flex: 1; padding: 15px; display: flex; gap: 10px; align-items: center; position: relative; }
        input[type="text"], select { padding: 10px; border: 1px solid #333; border-radius: 4px; outline: none; font-family: inherit; }
        select:disabled { background-color: #f0f0f0; color: #999; cursor: not-allowed; }
        .input-readonly { background-color: #f5f5f5; color: #999; cursor: not-allowed; border: 1px solid #ccc !important; }
        .hint { color: #888; font-size: 12px; line-height: 1.5; }

        .date-input-wrapper { position: relative; display: flex; align-items: center; width: fit-content; }
        #lostDate { padding-right: 40px; }
        .calendar-icon-svg { position: absolute; right: 10px; width: 24px; height: 24px; color: #333; pointer-events: none; }

        /* 상세 내용 + 사진 */
        .detail-row { display: flex; border-bottom: 1px solid #eee; }
        .detail-content { flex: 1; display: flex; border: 1px solid #333; margin: 15px; border-radius: 4px; overflow: hidden; height: 250px; }
        .detail-text { flex: 2; height: 100%; padding: 15px; border: none; resize: none; border-right: 1px solid #333; outline: none; font-family: inherit; }
        .detail-image-upload { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; text-align: center; }
        #uploadPlaceholder { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .image-icon { width: 45px; height: 45px; margin-bottom: 10px; color: #999; }
        .upload-placeholder { font-size: 12px; color: #999; }
        #imagePreview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .delete-img-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: none; align-items: center; justify-content: center; font-weight: bold; }

        /* 공통 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: white; width: 400px; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .modal-icon-svg { width: 65px; height: 65px; fill: #6ea8fe; }
        .modal-message { font-size: 20px; line-height: 1.4; white-space: pre-wrap; font-weight: 500; }
        .modal-btn-group { display: flex; width: 100%; gap: 10px; margin-top: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; transition: background 0.2s; }
        .modal-btn-cancel { background-color: #e0e0e0; color: #333; }
        .modal-btn-cancel:hover { background-color: #d0d0d0; }
        .modal-btn-ok { background-color: #6ea8fe; color: white; }
        .modal-btn-ok:hover { background-color: #5a95e5; }
        .modal-btn-ok:disabled { background-color: #c5dafc; cursor: not-allowed; }

        /* 작성 전 주의사항 모달 */
        .warning-box { width: 520px; text-align: left; align-items: stretch; }
        .warning-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 22px; font-weight: bold; color: #c62828; }
        .warning-title svg { width: 30px; height: 30px; fill: currentColor; }
        .warning-list { list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.7; }
        .warning-list li { padding: 12px 15px; background: #fff5f5; border-radius: 10px; }
        .warning-list b { color: #c62828; }
        .warning-check { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .warning-check input { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <div class="form-header">
            <h2 style="font-size: 24px;" th:text="${item == null} ? '探しています 投稿' : '探しています 編集'">探しています 投稿</h2>
            <div class="action-btns">
                <a href="#" id="btnCancel" class="btn btn-cancel">キャンセル</a>
                <button type="submit" form="lostForm" class="btn btn-submit" th:text="${item == null} ? '登録' : '保存'">登録</button>
            </div>
        </div>

        <!-- 입력 오류로 돌아와도 입력값은 th:field 로 유지된다 -->
        <form id="lostForm" th:object="${form}" method="post" enctype="multipart/form-data"
              th:action="${item == null} ? @{/lost-items/new} : @{/lost-items/{id}/edit(id=${item.id})}">

            <th:block th:if="${item == null}">
                <input type="hidden" id="warningConfirmed" name="warningConfirmed" th:value="${warningConfirmed == true}">
            </th:block>
            <th:block th:if="${item != null}">
                <!-- 입력 오류로 다시 열린 경우에도 지운 사진은 지운 상태 그대로 -->
                <input type="hidden" id="isImageDeleted" name="isImageDeleted" th:value="${isImageDeleted == true}">
            </th:block>

            <div class="form-row">
                <div class="form-label">タイトル</div>
                <div class="form-input">
                    <input type="text" id="autoTitle" class="input-readonly" readonly style="flex: 1; color: #333; font-weight: bold;">
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">なくした日</div>
                <div class="form-input">
                    <div class="date-input-wrapper">
                        <input type="text" id="lostDate" th:field="*{lostDate}" placeholder="年-月-日" style="width: 200px;">
                        <div class="calendar-icon-svg">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9 1V3H15V1H17V3H21C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3H7V1H9ZM20 11H4V19H20V11ZM7 5H4V9H20V5H17V7H15V5H9V7H7V5Z"></path></svg>
                        </div>
                    </div>
                    <span class="hint">はっきりしない場合は、だいたいの日付で構いません。</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">なくした場所</div>
                <div class="form-input">
                    <select id="lineSelect" th:field="*{lineName}" style="width: 150px;">
                        <option value="">路線を選択</option>
                        <option th:each="line : ${lines}" th:value="${line}" th:text="${line}"></option>
                    </select>
                    <select id="stationSelect" th:field="*{stationName}" style="width: 170px;">
                        <option value="">駅を選択</option>
                        <!-- 값은 LostItemForm.UNKNOWN_STATION 과 같아야 한다 -->
                        <option value="unknown">駅がわからない</option>
                        <option th:each="st : ${stations}" th:value="${st.stationName}" th:text="${st.stationName}" th:data-line="${st.lineName}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-label">なくした物</div>
                <div class="form-input">
                    <select id="categorySelect" th:field="*{categoryName}" style="width: 150px;">
                        <option value="">カテゴリー</option>
                        <option th:each="cat : ${categories}" th:value="${cat.categoryName}" th:text="${cat.categoryName}"></option>
                    </select>
                    <input type="text" id="itemName" th:field="*{itemName}" maxlength="100" placeholder="具体的な物 (例: 黒い長財布)" style="flex: 1;">
                </div>
            </div>

            <div class="detail-row">
                <div class="form-label">詳細</div>
                <div class="detail-content">
                    <textarea id="contents" th:field="*{contents}" class="detail-text" maxlength="500"
                              placeholder="なくした時の状況や場所、物の見た目などを書いてください。&#10;※ 中身や目印など、ご本人にしか分からない特徴は書かずに残しておくと、受け取りの際の確認に役立ちます。"></textarea>

                    <div class="detail-image-upload" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" name="imageFile" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;" onchange="previewImage(this)">
                        <div id="uploadPlaceholder">
                            <div class="image-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15V18H24V20H21V23H19V20H16V18H19V15H21ZM21.0082 3C21.556 3 22 3.44495 22 3.9934V13H20V5H4V18.999L14 9L17 12V14.829L14 11.8284L6.827 19H14V21H2.9918C2.44405 21 2 20.5551 2 20.0066V3.9934C2 3.44476 2.45531 3 2.9918 3H21.0082ZM8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7Z"></path></svg>
                            </div>
                            <p class="upload-placeholder">同じ物の写真や、<br>身につけていた時の写真があれば<br>追加してください。</p>
                        </div>
                        <img id="imagePreview" src="" alt="選択した画像">
                        <button type="button" class="delete-img-btn" id="deleteImgBtn" onclick="deleteImage(event)">✕</button>
                    </div>
                </div>
            </div>

            <div class="form-row" style="border-bottom: 2px solid #333;">
                <div class="form-label">投稿者</div>
                <div class="form-input">
                    <span style="font-weight: bold;" th:text="${item == null} ? ${loginMember.nickname} : ${item.author}">ニックネーム</span>
                </div>
            </div>
        </form>
    </div>

    <!-- 안내·확인 모달 -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <svg class="modal-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"></path></svg>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-btn-group">
                <button type="button" class="modal-btn modal-btn-cancel" id="modalCancelBtn" onclick="closeModal()">キャンセル</button>
                <button type="button" class="modal-btn modal-btn-ok" onclick="confirmModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- 작성 전 주의사항 (사기·절도 경고). 확인해야 작성 화면을 쓸 수 있다 -->
    <div id="warningModal" class="modal-overlay" th:if="${item == null}">
        <div class="modal-box warning-box">
            <div class="warning-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12.8659 3.00017L22.3922 19.5002C22.6684 19.9785 22.5045 20.5901 22.0262 20.8662C21.8742 20.954 21.7017 21.0002 21.5262 21.0002H2.47363C1.92135 21.0002 1.47363 20.5525 1.47363 20.0002C1.47363 19.8246 1.51984 19.6522 1.60761 19.5002L11.1339 3.00017C11.41 2.52187 12.0216 2.358 12.4999 2.63414C12.6519 2.72191 12.7782 2.84815 12.8659 3.00017ZM4.20568 19.0002H19.7941L11.9999 5.50017L4.20568 19.0002ZM10.9999 16.0002H12.9999V18.0002H10.9999V16.0002ZM10.9999 9.00017H12.9999V14.0002H10.9999V9.00017Z"></path></svg>
                投稿の前に必ずお読みください
            </div>
            <ul class="warning-list">
                <li>他人の忘れ物を<b>自分の物だと偽って受け取る行為は、詐欺罪</b>にあたります。</li>
                <li>他人の物を<b>持ち去ったり、自分の物にしたりする行為は、窃盗罪・遺失物等横領罪</b>にあたります。</li>
                <li>忘れ物の受け取りは、駅のお忘れ物承り所または警察を通して行ってください。<br>個人間での直接の受け渡しや、金銭の要求には応じないでください。</li>
            </ul>
            <label class="warning-check">
                <input type="checkbox" id="warningCheck"> 上記の内容を確認しました
            </label>
            <div class="modal-btn-group">
                <button type="button" class="modal-btn modal-btn-cancel" onclick="location.href='/lost-items'">戻る</button>
                <button type="button" class="modal-btn modal-btn-ok" id="warningOkBtn" disabled onclick="confirmWarning()">投稿へ進む</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ja.js"></script>
    <!-- 직접 입력한 날짜 확인 (형식이 틀린 날짜를 다른 날짜로 바꾸지 않게) -->
    <script th:src="@{/js/date-input.js}"></script>

    <script th:inline="javascript">
        const isNew = /*[[${item == null}]]*/ true;
        const existingImage = /*[[${item != null and item.imgPath != null} ? |/images/${item.imgPath}| : null]]*/ null;
        const cancelUrl = /*[[${item == null} ? @{/lost-items} : @{/lost-items/{id}(id=${item?.id})}]]*/ '/lost-items';
        const serverError = /*[[${errorMessage}]]*/ null;

        // ---------- 모달 ----------
        const modal = document.getElementById('customModal');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        let onConfirmAction = null;

        function showModal(message, okCallback, hasCancel = false) {
            document.getElementById('modalMessage').innerText = message;
            modalCancelBtn.style.display = hasCancel ? 'block' : 'none';
            onConfirmAction = okCallback;
            modal.style.display = 'flex';
        }
        function confirmModal() {
            modal.style.display = 'none';
            if (onConfirmAction) onConfirmAction();
            onConfirmAction = null;
        }
        function closeModal() {
            modal.style.display = 'none';
            onConfirmAction = null;
        }

        // ---------- 작성 전 주의사항 ----------
        const warningConfirmed = document.getElementById('warningConfirmed');
        if (isNew) {
            const warningCheck = document.getElementById('warningCheck');
            warningCheck.addEventListener('change', () => {
                document.getElementById('warningOkBtn').disabled = !warningCheck.checked;
            });
        }
        function confirmWarning() {
            warningConfirmed.value = 'true';
            document.getElementById('warningModal').style.display = 'none';
        }

        // 주의사항 창이 열려 있는 동안 키보드(Tab)로는 창 안에서만 이동한다 (뒤의 입력 칸으로 빠져나가지 않게)
        function openWarningModal() {
            const warningModal = document.getElementById('warningModal');
            warningModal.style.display = 'flex';
            document.getElementById('warningCheck').focus();
            warningModal.addEventListener('keydown', e => {
                if (e.key !== 'Tab') return;
                const items = [...warningModal.querySelectorAll('input, button:not([disabled])')];
                const first = items[0];
                const last = items[items.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            });
        }

        // ---------- 달력 ----------
        flatpickr('#lostDate', {
            ...strictDateOptions(message => showModal(message, () => document.getElementById('lostDate').focus())),
            locale: 'ja',
            dateFormat: 'Y-m-d',
            maxDate: 'today',
            onChange: updateAutoTitle
        });

        // ---------- 노선 → 역 목록 ----------
        const lineSelect = document.getElementById('lineSelect');
        const stationSelect = document.getElementById('stationSelect');
        const allStationOptions = Array.from(stationSelect.options);

        // 선택한 노선의 역만 남긴다 ("駅を選択", "駅がわからない" 는 항상 표시)
        function renderStations(keepValue) {
            const selectedLine = lineSelect.value;
            const current = stationSelect.value;
            stationSelect.innerHTML = '';
            allStationOptions.forEach(opt => {
                if (!opt.dataset.line || opt.dataset.line === selectedLine) {
                    stationSelect.appendChild(opt);
                }
            });
            stationSelect.disabled = (selectedLine === '');
            const stillExists = Array.from(stationSelect.options).some(opt => opt.value === current);
            stationSelect.value = (keepValue && stillExists) ? current : '';
        }
        lineSelect.addEventListener('change', () => { renderStations(false); updateAutoTitle(); });

        // ---------- 자동 제목 (서버에서도 같은 형식으로 다시 만든다) ----------
        ['stationSelect', 'categorySelect'].forEach(id => document.getElementById(id).addEventListener('change', updateAutoTitle));
        ['lostDate', 'itemName'].forEach(id => document.getElementById(id).addEventListener('input', updateAutoTitle));

        function updateAutoTitle() {
            const date = document.getElementById('lostDate').value;
            const line = lineSelect.value;
            const station = stationSelect.value === 'unknown' ? '駅不明' : stationSelect.value;
            const category = document.getElementById('categorySelect').value;
            const item = document.getElementById('itemName').value.trim();
            document.getElementById('autoTitle').value =
                (date && line && station && category && item) ? `[${date}][${line}][${station}][${category}] ${item}` : '';
        }

        // ---------- 사진 (JPG・PNG・GIF・WEBP, 10MB 이하) ----------
        const ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        const MAX_IMAGE_SIZE = 10 * 1024 * 1024;
        const isImageDeleted = document.getElementById('isImageDeleted');

        function showPreview(src) {
            document.getElementById('imagePreview').src = src;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('deleteImgBtn').style.display = 'flex';
            document.getElementById('uploadPlaceholder').style.display = 'none';
        }

        function previewImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (!ALLOWED_IMAGE_TYPES.includes(file.type) || file.size > MAX_IMAGE_SIZE) {
                input.value = '';
                showModal('10MB以下の画像ファイル(JPG・PNG・GIF・WEBP)を選択してください。');
                return;
            }
            if (isImageDeleted) isImageDeleted.value = 'false';
            const reader = new FileReader();
            reader.onload = e => {
                // 확장자만 바꾼 파일(.txt → .jpg 등)은 그림으로 열 수 없다 → 깨진 미리 보기 대신 안내 (서버에서도 다시 확인)
                const probe = new Image();
                probe.onload = () => showPreview(e.target.result);
                probe.onerror = () => {
                    input.value = '';
                    showModal('画像を読み込めませんでした。\n画像ファイル(JPG・PNG・GIF・WEBP)を選択してください。');
                };
                probe.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function deleteImage(event) {
            event.stopPropagation();
            document.getElementById('fileInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('deleteImgBtn').style.display = 'none';
            document.getElementById('uploadPlaceholder').style.display = 'flex';
            if (isImageDeleted) isImageDeleted.value = 'true'; // 수정 화면: 기존 사진 삭제
        }

        // ---------- 제출 전 확인 ----------
        document.getElementById('lostForm').addEventListener('submit', function(e) {
            const dateEl = document.getElementById('lostDate');
            const dateVal = dateEl.value.trim();
            let message = null;
            let target = null;

            if (!dateVal) {
                message = 'なくした日を入力してください。'; target = dateEl;
            } else if (!isValidPastDate(dateVal)) {
                message = '日付が正しくありません。\n(例: 2026-01-01、未来の日付は不可)'; target = dateEl;
            } else {
                const requiredFields = [
                    { id: 'lineSelect', message: '路線を選択してください。' },
                    { id: 'stationSelect', message: '駅を選択してください。\n(わからない場合は「駅がわからない」)' },
                    { id: 'categorySelect', message: 'カテゴリーを選択してください。' },
                    { id: 'itemName', message: '具体的な物を入力してください。' },
                    { id: 'contents', message: '詳細を入力してください。' }
                ];
                const empty = requiredFields.find(field => !document.getElementById(field.id).value.trim());
                if (empty) {
                    message = empty.message; target = document.getElementById(empty.id);
                }
            }

            if (message) {
                e.preventDefault();
                showModal(message, () => target.focus());
            }
        });

        // YYYY-MM-DD 형식이고, 실제로 있는 날짜이며, 오늘 이전인지
        function isValidPastDate(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const [y, m, d] = value.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d && date <= today;
        }

        // 입력 칸에서 엔터를 눌러도 바로 제출되지 않게
        document.querySelectorAll('#lostForm input[type="text"]').forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            });
        });

        // 취소: 확인 후 이동
        document.getElementById('btnCancel').addEventListener('click', function(e) {
            e.preventDefault();
            showModal('ページから移動しますか？\n変更内容は保存されません。', () => { location.href = cancelUrl; }, true);
        });

        // ---------- 처음 표시 ----------
        renderStations(true);
        updateAutoTitle();
        if (existingImage) showPreview(existingImage);

        if (isNew && warningConfirmed.value !== 'true') {
            openWarningModal(); // 주의사항부터 확인
        } else if (serverError) {
            showModal(serverError); // 서버 측 검증에서 걸린 경우
        }
    </script>
</body>
</html>
