<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | パスワード変更</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; }

        /* 회원가입 화면과 같은 모양 */
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .action-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }
        .btn { padding: 8px 25px; border-radius: 20px; border: 1px solid #ccc; cursor: pointer; font-size: 14px; font-family: inherit; text-decoration: none; color: #333; background: #f0f0f0; transition: all 0.2s; }
        .btn-submit { color: #e63946; font-weight: bold; }
        .btn:hover { background: #e5e5e5; }

        .form-row { display: flex; border-bottom: 1px solid #eee; align-items: center; min-height: 70px; }
        .form-label { width: 180px; padding: 20px; font-weight: bold; }
        .form-input { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 6px; }

        input[type="password"] { width: 280px; padding: 10px; border: 1px solid #333; border-radius: 4px; font-family: inherit; }
        input:focus-visible { outline: 3px solid #1a73e8; outline-offset: 1px; }
        .input-error { border-color: #e63946 !important; }
        .field-note { font-size: 12px; color: #666; }
        .field-error { font-size: 13px; color: #c62828; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <main class="container">
        <div class="form-header">
            <h2 style="font-size: 24px;">パスワード変更</h2>
        </div>

        <!-- 비밀번호는 에러가 나도 다시 채워 넣지 않는다 -->
        <form id="passwordForm" th:action="@{/mypage/password}" th:object="${passwordForm}" method="post" novalidate>
            <div class="form-row">
                <label class="form-label" for="currentPassword">現在のパスワード</label>
                <div class="form-input">
                    <input type="password" id="currentPassword" name="currentPassword" maxlength="64" autocomplete="current-password"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'input-error'" th:aria-describedby="${#fields.hasErrors('currentPassword')} ? 'currentPassword-error' : null" th:aria-invalid="${#fields.hasErrors('currentPassword')} ? 'true' : null">
                    <span class="field-error" id="currentPassword-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="newPassword">新しいパスワード</label>
                <div class="form-input">
                    <input type="password" id="newPassword" name="newPassword" maxlength="64" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'input-error'" th:aria-describedby="${#fields.hasErrors('newPassword')} ? 'newPassword-note newPassword-error' : 'newPassword-note'" th:aria-invalid="${#fields.hasErrors('newPassword')} ? 'true' : null">
                    <span class="field-note" id="newPassword-note">英字と数字を含む8〜64文字(半角)</span>
                    <span class="field-error" id="newPassword-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="newPasswordConfirm">新しいパスワード(確認)</label>
                <div class="form-input">
                    <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" maxlength="64" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'input-error'" th:aria-describedby="${#fields.hasErrors('newPasswordConfirm')} ? 'newPasswordConfirm-error' : null" th:aria-invalid="${#fields.hasErrors('newPasswordConfirm')} ? 'true' : null">
                    <span class="field-error" id="newPasswordConfirm-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></span>
                </div>
            </div>

            <div class="action-btns">
                <a th:href="@{/mypage}" class="btn">キャンセル</a>
                <button type="submit" class="btn btn-submit">変更する</button>
            </div>
        </form>
    </main>
    <!-- 오류 칸으로 포커스, 생년월일 상한, 탈퇴 확인, 로그인 빈 칸 안내 -->
    <script th:src="@{/js/member-form.js}"></script>
</body>
</html>
