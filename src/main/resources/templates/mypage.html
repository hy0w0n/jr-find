<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | マイページ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; align-items: flex-start; }
        .mypage-section { flex: 3; min-width: 0; }
        .side-section { flex: 1; margin-top: 60px; }

        .page-title-area { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .page-title { font-size: 24px; }

        .message { margin-top: 20px; padding: 12px 15px; border-radius: 6px; font-size: 14px; background: #e8f5e9; color: #2e7d32; }

        /* 회원정보 */
        .profile-card { margin-top: 25px; border: 1px solid #ddd; border-radius: 12px; padding: 25px 30px; }
        .profile-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .profile-name { font-size: 20px; font-weight: bold; min-width: 0; overflow-wrap: anywhere; } /* 긴 닉네임·ID 도 버튼과 겹치지 않게 */
        .profile-id { margin-left: 8px; font-size: 13px; color: #999; font-weight: normal; }
        .profile-btns { display: flex; gap: 10px; }
        .btn { padding: 7px 20px; border-radius: 20px; border: 1px solid #ccc; background: #f0f0f0; color: #333; font-size: 13px; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #e5e5e5; }
        .profile-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .profile-table th { width: 140px; padding: 10px 0; text-align: left; font-weight: normal; color: #888; border-top: 1px solid #f0f0f0; }
        .profile-table td { padding: 10px 0; border-top: 1px solid #f0f0f0; }
        .withdraw-link { margin-top: 10px; text-align: right; font-size: 12px; }
        .withdraw-link a { color: #999; }

        /* 탭 */
        .tabs { display: flex; margin-top: 40px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 25px; font-size: 15px; color: #888; text-decoration: none; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; margin-bottom: -1px; }
        .tab:hover { color: #333; }
        .tab.active { color: #333; font-weight: bold; border-color: #333; background: #fff; }
        .tab-count { margin-left: 4px; color: #e63946; font-size: 13px; }
        .tab-note { margin-top: 10px; font-size: 12px; color: #999; }

        /* 목록 (게시판 목록 화면과 같은 모양) */
        .my-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; }
        .my-table th { padding: 8px 5px; border-bottom: 1px solid #ddd; font-size: 13px; font-weight: normal; color: #888; }
        .my-table td { padding: 14px 10px; border-bottom: 1px solid #eee; font-size: 14px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .td-center { text-align: center; }
        /* 한 줄 전체를 누르면 상세로: 물건 이름 링크를 줄 전체로 넓힌다 (가운데 클릭·Ctrl+클릭으로 새 탭, 키보드 Tab·Enter 도 된다) */
        .my-table tbody tr { position: relative; }
        .my-table tbody tr:hover { background-color: #fafafa; }
        .my-table tbody tr:focus-within { outline: 2px solid #333; outline-offset: -2px; }
        .row-link::after { content: ''; position: absolute; inset: 0; }
        .row-link:focus { outline: none; }
        .comment-link { color: inherit; text-decoration: none; }
        .row-resolved td { color: #aaa; }
        .station-unknown { color: #aaa; }
        .category { color: #888; font-size: 12px; }
        .divider { margin: 0 5px; color: #ddd; }
        .item-name { font-weight: bold; color: #333; text-decoration: none; }
        .comment-count { margin-left: 4px; color: #e63946; font-size: 12px; font-weight: bold; }
        .badge-resolved { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: bold; vertical-align: middle; }
        .board-label { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 10px; background: #f0f0f0; color: #666; font-size: 11px; vertical-align: middle; }
        .empty { padding: 60px 0; text-align: center; font-size: 14px; color: #bbb; border-bottom: 1px solid #eee; }

        .pager { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px; margin-top: 30px; font-size: 14px; color: #555; }
        .pager a { color: #555; text-decoration: none; }
        .pager a:hover { color: #333; text-decoration: underline; }
        .pager .active { color: #333; font-weight: bold; text-decoration: underline; }
        .pager .disabled { color: #ccc; }

        /* 사이드바 */
        .sidebar-card { border: 1px solid #ddd; border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 25px; }
        .sidebar-card p { font-size: 15px; color: #444; margin-bottom: 20px; }
        .write-btn-link { display: block; width: 100%; padding: 12px; background-color: #f0f0f0; color: #e63946; text-decoration: none; font-weight: bold; border-radius: 6px; transition: background 0.2s; }
        .write-btn-link:hover { background-color: #e5e5e5; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main id="main" class="mypage-section">
            <div class="page-title-area">
                <h1 class="page-title">マイページ</h1>
            </div>

            <div class="message" th:if="${param.updated}">会員情報を変更しました。</div>
            <div class="message" th:if="${param.passwordChanged}">パスワードを変更しました。</div>

            <!-- 회원정보 (본인에게만 보이는 화면) -->
            <section class="profile-card">
                <div class="profile-head">
                    <div class="profile-name">
                        <span th:text="${member.nickname}">ニックネーム</span>
                        <span class="profile-id" th:text="|ID: ${member.loginId}|">ID</span>
                    </div>
                    <div class="profile-btns">
                        <a th:href="@{/mypage/edit}" class="btn">会員情報を変更</a>
                        <a th:href="@{/mypage/password}" class="btn">パスワード変更</a>
                    </div>
                </div>
                <table class="profile-table">
                    <tr><th>氏名</th><td th:text="${member.realName}"></td></tr>
                    <tr><th>生年月日</th><td th:text="${#temporals.format(member.birthDate, 'yyyy年M月d日')}"></td></tr>
                    <tr><th>電話番号</th><td th:text="${member.phone}"></td></tr>
                    <tr><th>登録日</th><td th:text="${#temporals.format(member.registrationDate, 'yyyy年M月d日')}"></td></tr>
                </table>
                <p class="withdraw-link"><a th:href="@{/mypage/withdraw}">退会する</a></p>
            </section>

            <!-- 내가 쓴 글·댓글 -->
            <nav class="tabs" aria-label="自分の投稿・コメント">
                <a th:href="@{/mypage(tab='found')}" class="tab" th:classappend="${tab == 'found'} ? 'active'" th:aria-current="${tab == 'found'} ? 'page' : null">見つけた<span class="tab-count" th:text="${foundCount}">0</span></a>
                <a th:href="@{/mypage(tab='lost')}" class="tab" th:classappend="${tab == 'lost'} ? 'active'" th:aria-current="${tab == 'lost'} ? 'page' : null">探しています<span class="tab-count" th:text="${lostCount}">0</span></a>
                <a th:href="@{/mypage(tab='comments')}" class="tab" th:classappend="${tab == 'comments'} ? 'active'" th:aria-current="${tab == 'comments'} ? 'page' : null">コメント<span class="tab-count" th:text="${commentCount}">0</span></a>
            </nav>

            <!-- 見つけた -->
            <th:block th:if="${tab == 'found'}">
                <p class="tab-note">ログインせずに投稿した記事は、ここには表示されません。</p>
                <p class="empty" th:if="${foundItems.isEmpty()}">投稿はまだありません。</p>
                <table class="my-table" th:unless="${foundItems.isEmpty()}">
                    <colgroup><col style="width: 14%;"><col style="width: 15%;"><col style="width: 15%;"><col style="width: auto;"><col style="width: 18%;"></colgroup>
                    <thead><tr><th>日付</th><th>路線</th><th>駅</th><th>忘れ物</th><th>作成日</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${foundItems}">
                            <td class="td-center" th:text="${item.foundDate}"></td>
                            <td th:text="${item.lineName}" th:title="${item.lineName}"></td>
                            <td th:text="${item.stationName}"></td>
                            <td>
                                <span class="category" th:text="${item.categoryName}"></span><span class="divider">|</span>
                                <a class="item-name row-link" th:href="@{/items/{id}(id=${item.id})}" th:text="${item.itemName}" th:title="${item.itemName}"></a>
                                <span class="comment-count" th:if="${item.commentCount > 0}" th:text="|[${item.commentCount}]|" th:aria-label="|コメント${item.commentCount}件|" title="コメント数"></span>
                            </td>
                            <td class="td-center" th:text="${#temporals.format(item.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </th:block>

            <!-- 探しています -->
            <th:block th:if="${tab == 'lost'}">
                <p class="empty" th:if="${lostItems.isEmpty()}">投稿はまだありません。</p>
                <table class="my-table" th:unless="${lostItems.isEmpty()}">
                    <colgroup><col style="width: 14%;"><col style="width: 15%;"><col style="width: 15%;"><col style="width: auto;"><col style="width: 18%;"></colgroup>
                    <thead><tr><th>なくした日</th><th>路線</th><th>駅</th><th>忘れ物</th><th>作成日</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${lostItems}" th:classappend="${item.resolved} ? 'row-resolved'">
                            <td class="td-center" th:text="${item.lostDate}"></td>
                            <td th:text="${item.lineName}" th:title="${item.lineName}"></td>
                            <td th:if="${item.stationName != null}" th:text="${item.stationName}"></td>
                            <td th:unless="${item.stationName != null}" class="station-unknown">不明</td>
                            <td>
                                <span class="badge-resolved" th:if="${item.resolved}">見つかりました</span>
                                <span class="category" th:text="${item.categoryName}"></span><span class="divider">|</span>
                                <a class="item-name row-link" th:href="@{/lost-items/{id}(id=${item.id})}" th:text="${item.itemName}" th:title="${item.itemName}"></a>
                                <span class="comment-count" th:if="${item.commentCount > 0}" th:text="|[${item.commentCount}]|" th:aria-label="|コメント${item.commentCount}件|" title="コメント数"></span>
                            </td>
                            <td class="td-center" th:text="${#temporals.format(item.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </th:block>

            <!-- コメント -->
            <th:block th:if="${tab == 'comments'}">
                <p class="empty" th:if="${comments.isEmpty()}">コメントはまだありません。</p>
                <table class="my-table" th:unless="${comments.isEmpty()}">
                    <colgroup><col style="width: 38%;"><col style="width: auto;"><col style="width: 18%;"></colgroup>
                    <thead><tr><th>コメント</th><th>投稿</th><th>作成日</th></tr></thead>
                    <tbody>
                        <!-- 댓글 내용이 그 게시글의 댓글 위치 링크 (줄 전체로 넓혀서 어디를 눌러도 이동) -->
                        <tr th:each="comment : ${comments}">
                            <td><a class="comment-link row-link" th:href="@{${comment.postUrl}}" th:text="${comment.contents}" th:title="${comment.contents}"></a></td>
                            <td th:title="${comment.postTitle}">
                                <span class="board-label" th:text="${comment.board.name() == 'FOUND'} ? '見つけた' : '探しています'"></span>
                                <span th:text="${comment.postItemName}"></span> <!-- 제목은 날짜·노선부터 시작해서 물건 이름이 잘리므로 물건 이름만 (전체 제목은 마우스를 올리면) -->
                            </td>
                            <td class="td-center" th:text="${#temporals.format(comment.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </th:block>

            <!-- 페이지 번호: 처음·끝과 지금 페이지 앞뒤 2쪽만 (나머지는 「…」) -->
            <nav class="pager" th:if="${totalPages > 1}" aria-label="ページ">
                <a th:if="${currentPage > 1}" th:href="@{/mypage(tab=${tab}, page=${currentPage - 1})}" aria-label="前のページ">&lt;</a>
                <span th:unless="${currentPage > 1}" class="disabled" aria-hidden="true">&lt;</span>
                <th:block th:each="pageNum : ${pageNumbers}">
                    <span th:if="${pageNum == null}" aria-hidden="true">…</span>
                    <span th:if="${pageNum != null and pageNum == currentPage}" class="active" aria-current="page" th:text="${pageNum}"></span>
                    <a th:if="${pageNum != null and pageNum != currentPage}" th:href="@{/mypage(tab=${tab}, page=${pageNum})}"
                       th:text="${pageNum}" th:aria-label="|${pageNum}ページ|"></a>
                </th:block>
                <a th:if="${currentPage < totalPages}" th:href="@{/mypage(tab=${tab}, page=${currentPage + 1})}" aria-label="次のページ">&gt;</a>
                <span th:unless="${currentPage < totalPages}" class="disabled" aria-hidden="true">&gt;</span>
            </nav>
        </main>

        <aside class="side-section">
            <div class="sidebar-card">
                <p>忘れ物を見つけましたか？</p>
                <a th:href="@{/items/new}" class="write-btn-link">「見つけた」に投稿</a>
            </div>
            <div class="sidebar-card">
                <p>忘れ物をお探しですか？</p>
                <a th:href="@{/lost-items/new}" class="write-btn-link">「探しています」に投稿</a>
            </div>
        </aside>
    </div>
</body>
</html>
