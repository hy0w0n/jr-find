<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | 探しています</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; }
        .container { width: 90%; max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; align-items: flex-start; }
        .board-section { flex: 3; }
        .side-section { flex: 1; margin-top: 60px; }

        /* 게시판 상단 헤더 */
        .board-title-area { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .board-desc { font-size: 13px; color: #888; }

        /* 게시판 테이블 (見つけた 게시판과 같은 모양) */
        .lost-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .lost-table th { border-bottom: 1px solid #333; font-size: 14px; color: #555; text-align: center; background-color: #fff; padding: 5px 5px; vertical-align: middle; }
        .th-filter { vertical-align: top !important; }
        .lost-table td { padding: 15px 10px; border-bottom: 1px solid #eee; font-size: 14px; text-align: left; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .td-center { text-align: center !important; }
        .hover-row:hover { background-color: #fafafa; }
        .row-resolved td { color: #aaa; }

        .filter-box { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
        .filter-select { width: 95%; padding: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; color: #666; outline: none; }

        .sort-wrapper { display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
        .sort-icon { width: 14px; height: 14px; transition: transform 0.3s; }
        .sort-asc .sort-icon { transform: rotate(180deg); }
        .lost-table th.sort-active { color: #e63946; } /* 지금 정렬 중인 열 */

        .station-unknown { color: #aaa; }
        /* 찾았음 표시 */
        .badge-resolved { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: bold; vertical-align: middle; }

        /* 사이드바 */
        .sidebar-card { border: 1px solid #ddd; border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 25px; }
        .sidebar-card p { font-size: 15px; color: #444; margin-bottom: 20px; }
        .sidebar-note { font-size: 12px !important; color: #999 !important; margin: -10px 0 15px !important; }
        .write-btn-link { display: block; width: 100%; padding: 12px; background-color: #f0f0f0; color: #e63946; text-decoration: none; font-weight: bold; border-radius: 6px; transition: background 0.2s; }
        .write-btn-link:hover { background-color: #e5e5e5; }
        .btn-gray { background-color: #f0f0f0; color: #333; }

        /* 하단 페이지네이션 */
        .pager { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 40px; color: #888; font-size: 14px; }
        .pager .page-num.active { color: #333; font-weight: bold; text-decoration: underline; }
        /* 검색어 조건 */
        .keyword-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding: 10px 15px; background: #f7f7f7; border-radius: 6px; font-size: 14px; color: #555; }
        .keyword-bar b { color: #e63946; }
        .keyword-clear { margin-left: auto; background: none; border: none; font-size: 13px; font-family: inherit; color: #888; text-decoration: underline; cursor: pointer; }
        .keyword-clear:hover { color: #333; }
        .keyword-warn { color: #c0392b; font-size: 12px; } /* 6번째 단어부터는 검색에 쓰지 않았다는 안내 */
        /* 게시판 안 검색창 */
        .board-tools { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .board-search { position: relative; width: 320px; max-width: 100%; }
        .board-search input[type="text"] { width: 100%; padding: 8px 40px 8px 16px; border: 1px solid #ccc; border-radius: 20px; font-size: 13px; font-family: inherit; outline: none; }
        .board-search input[type="text"]:focus { border-color: #333; }
        .board-search-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; padding: 0; border: none; background: none; color: #555; cursor: pointer; }
        .board-search-btn svg { width: 100%; height: 100%; }
        /* 댓글 수 */
        .comment-count { margin-left: 4px; color: #e63946; font-size: 12px; font-weight: bold; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main class="board-section">
            <div class="board-title-area">
                <h2 style="font-size: 24px;">探しています</h2>
                <span class="board-desc">なくした物を探している方の投稿です</span>
            </div>

            <!-- 이 게시판 안에서만 검색 (제목·본문). 헤더 검색창은 두 게시판 통합 검색 -->
            <!-- 지금 고른 노선·역·忘れ物 필터와 정렬은 그대로 두고 1페이지부터 보여준다 -->
            <div class="board-tools">
                <form id="boardSearch" class="board-search" th:action="@{/lost-items}" method="get" role="search">
                    <input type="hidden" name="line" th:value="${currentLine}">
                    <input type="hidden" name="station" th:value="${currentStation}">
                    <input type="hidden" name="category" th:value="${currentCategory}">
                    <input type="hidden" name="sort" th:value="${currentSort}">
                    <input type="text" id="boardKeyword" name="q" maxlength="100" placeholder="この掲示板内を検索（タイトル・本文）"
                           aria-label="探しています 掲示板内を検索" th:value="${currentKeyword}">
                    <button type="submit" class="board-search-btn" title="この掲示板内を検索">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"></path></svg>
                    </button>
                </form>
            </div>

            <!-- 검색어로 찾은 경우 (게시판 안 검색창, 또는 헤더 검색 → 통합 검색 → 「すべて見る」) -->
            <div class="keyword-bar" th:if="${currentKeyword != null}">
                <span>「<b th:text="${currentKeyword}">キーワード</b>」の検索結果 <span th:text="${totalItems}">0</span>件<span class="keyword-warn" th:if="${keywordTruncated}"> (キーワードは5語までです。最初の5語で検索しています。)</span></span>
                <button type="button" class="keyword-clear" onclick="clearKeyword()">検索をやめる</button>
            </div>

            <table class="lost-table">
                <colgroup>
                    <col style="width: 12%;"> <col style="width: 13%;"> <col style="width: 13%;"> <col style="width: auto;"> <col style="width: 15%;"> <col style="width: 15%;">
                </colgroup>
                <thead>
                    <tr>
                        <th onclick="toggleSort('date')" style="cursor: pointer;" id="header-date">
                            <div class="sort-wrapper">
                                <span>なくした日</span>
                                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16L6 10H18L12 16Z"></path></svg>
                            </div>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <span>路線</span>
                                <select class="filter-select" id="lineFilter">
                                    <option value=""></option>
                                    <option th:each="line : ${lines}" th:value="${line}" th:text="${line}"></option>
                                </select>
                            </div>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <span>駅</span>
                                <select class="filter-select" id="stationFilter">
                                    <option value=""></option>
                                </select>
                            </div>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <span>忘れ物</span>
                                <select class="filter-select" id="categoryFilter">
                                    <option value=""></option>
                                    <option th:each="cat : ${categories}" th:value="${cat.categoryName}" th:text="${cat.categoryName}"></option>
                                </select>
                            </div>
                        </th>
                        <th>作成者</th>
                        <th onclick="toggleSort('reg')" style="cursor: pointer;" id="header-reg">
                            <div class="sort-wrapper">
                                <span>作成日</span>
                                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16L6 10H18L12 16Z"></path></svg>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${items.isEmpty()}">
                        <td colspan="6" style="padding: 100px 0; color: #ccc; text-align: center;">
                            <!-- 검색어나 필터로 거른 결과가 0건이면 「条件に一致する」 -->
                            <th:block th:if="${currentKeyword == null and #strings.isEmpty(currentLine) and #strings.isEmpty(currentStation) and #strings.isEmpty(currentCategory)}">登録されている投稿はありません。</th:block>
                            <th:block th:unless="${currentKeyword == null and #strings.isEmpty(currentLine) and #strings.isEmpty(currentStation) and #strings.isEmpty(currentCategory)}">条件に一致する投稿はありません。</th:block>
                        </td>
                    </tr>

                    <tr th:each="item : ${items}"
                        th:onclick="|location.href='@{/lost-items/{id}(id=${item.id})}'|"
                        th:classappend="${item.resolved} ? 'row-resolved'"
                        style="cursor: pointer;"
                        class="hover-row">
                        <td class="td-center" th:text="${item.lostDate}"></td>
                        <td th:text="${item.lineName}" th:title="${item.lineName}"></td>
                        <td th:if="${item.stationName != null}" th:text="${item.stationName}" th:title="${item.stationName}"></td>
                        <td th:unless="${item.stationName != null}" class="station-unknown">不明</td>
                        <td>
                            <span class="badge-resolved" th:if="${item.resolved}">見つかりました</span>
                            <span style="color: #888; font-size: 12px;" th:text="${item.categoryName}"></span>
                            <span style="margin: 0 5px; color: #ddd;">|</span>
                            <span style="font-weight: bold; color: #333;" th:text="${item.itemName}" th:title="${item.itemName}"></span>
                            <span class="comment-count" th:if="${item.commentCount > 0}" th:text="|[${item.commentCount}]|" title="コメント数"></span>
                        </td>
                        <td class="td-center" th:text="${item.author}" th:title="${item.author}"></td>
                        <td class="td-center" th:text="${#temporals.format(item.registrationDate, 'yyyy-MM-dd')}" th:title="${#temporals.format(item.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="pager" th:if="${totalPages > 0}">
                <span th:if="${currentPage > 1}" th:onclick="|goPage(null, null, null, null, ${currentPage - 1})|" style="cursor: pointer;">&lt;</span>
                <span th:unless="${currentPage > 1}" style="color: #ccc;">&lt;</span>

                <span th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                      th:text="${pageNum}"
                      th:classappend="${pageNum == currentPage} ? 'active'"
                      class="page-num"
                      style="cursor: pointer;"
                      th:onclick="|goPage(null, null, null, null, ${pageNum})|"></span>

                <span th:if="${currentPage < totalPages}" th:onclick="|goPage(null, null, null, null, ${currentPage + 1})|" style="cursor: pointer;">&gt;</span>
                <span th:unless="${currentPage < totalPages}" style="color: #ccc;">&gt;</span>
            </div>
        </main>

        <aside class="side-section">
            <div class="sidebar-card">
                <p>忘れ物をお探しですか？</p>
                <p class="sidebar-note" th:if="${loginMember == null}">投稿にはログインが必要です。</p>
                <a th:href="@{/lost-items/new}" class="write-btn-link">投稿する</a>
            </div>
            <div class="sidebar-card">
                <p>忘れ物を見つけましたか？</p>
                <a th:href="@{/items}" class="write-btn-link btn-gray">見つけた 掲示板</a>
            </div>
        </aside>
    </div>

    <script th:inline="javascript">
        const allStationsData = [
            /*[# th:each="st : ${stations}"]*/
            { name: /*[[${st.stationName}]]*/ "StationName", line: /*[[${st.lineName}]]*/ "LineName" },
            /*[/]*/
        ];
        const allLinesData = /*[[${lines}]]*/ [];
        const serverLine = /*[[${currentLine}]]*/ "";
        const serverStation = /*[[${currentStation}]]*/ "";
        const serverCategory = /*[[${currentCategory}]]*/ "";
        let keyword = /*[[${currentKeyword}]]*/ "";
        // 정렬 기본값(latest)은 작성일 내림차순과 같다
        const serverSort = /*[[${currentSort}]]*/ "reg_desc";
        const currentSort = (serverSort && serverSort !== 'latest') ? serverSort : 'reg_desc';

        const lineFilter = document.getElementById('lineFilter');
        const stationFilter = document.getElementById('stationFilter');
        const categoryFilter = document.getElementById('categoryFilter');

        const UNKNOWN_STATION = 'unknown'; // 역을 모르고 쓴 글 (LostItemForm.UNKNOWN_STATION)

        // 역을 고르면 그 역이 있는 노선만, 노선을 고르면 그 노선의 역만 보여준다
        function renderLineOptions(selectedStation) {
            const targetLines = (selectedStation && selectedStation !== UNKNOWN_STATION)
                ? [...new Set(allStationsData.filter(st => st.name === selectedStation).map(st => st.line))]
                : allLinesData;
            fillOptions(lineFilter, targetLines, serverLine);
        }

        function renderStationOptions(selectedLine) {
            const names = [...new Set(allStationsData
                .filter(st => !selectedLine || st.line === selectedLine)
                .map(st => st.name))];
            fillOptions(stationFilter, names, serverStation);
            // 맨 끝에 「駅不明」: 역을 모르고 쓴 글만 보기
            stationFilter.add(new Option('駅不明', UNKNOWN_STATION));
            if (serverStation === UNKNOWN_STATION) stationFilter.value = UNKNOWN_STATION;
        }

        function fillOptions(select, values, selected) {
            select.innerHTML = '<option value=""></option>';
            values.forEach(value => select.add(new Option(value, value)));
            select.value = values.includes(selected) ? selected : "";
        }

        function goPage(newLine, newStation, newCategory, newSort, newPage) {
            const params = new URLSearchParams({
                line: newLine !== null ? newLine : lineFilter.value,
                station: newStation !== null ? newStation : stationFilter.value,
                category: newCategory !== null ? newCategory : categoryFilter.value,
                sort: newSort !== null ? newSort : currentSort,
                page: newPage !== null ? newPage : 1
            });
            if (keyword) params.set('q', keyword);
            location.href = '/lost-items?' + params.toString();
        }

        // 검색어만 지우고 나머지 조건(노선·역·카테고리·정렬)은 유지
        function clearKeyword() {
            keyword = '';
            goPage(null, null, null, null, 1);
        }

        // type: 'date'(なくした日) 또는 'reg'(作成日). 같은 항목을 다시 누르면 오름차순/내림차순 전환
        function toggleSort(type) {
            const nextSort = (currentSort === type + '_desc') ? type + '_asc' : type + '_desc';
            goPage(null, null, null, nextSort, 1);
        }

        if (serverCategory) categoryFilter.value = serverCategory;
        document.getElementById(currentSort.startsWith('date') ? 'header-date' : 'header-reg').classList.add('sort-active');
        if (currentSort === 'date_asc') document.getElementById('header-date').classList.add('sort-asc');
        if (currentSort === 'reg_asc') document.getElementById('header-reg').classList.add('sort-asc');
        renderLineOptions(serverStation);
        renderStationOptions(serverLine);

        lineFilter.addEventListener('change', function() { goPage(this.value, null, null, null, 1); });
        stationFilter.addEventListener('change', function() { goPage(null, this.value, null, null, 1); });
        categoryFilter.addEventListener('change', function() { goPage(null, null, this.value, null, 1); });

        // 게시판 안 검색: 빈 칸이면 보내지 않는다 (검색 중이었다면 검색어만 지운다)
        document.getElementById('boardSearch').addEventListener('submit', function(e) {
            const input = document.getElementById('boardKeyword');
            if (input.value.trim() !== '') return;
            e.preventDefault();
            if (keyword) {
                clearKeyword();
            } else {
                input.focus();
            }
        });
    </script>
</body>
</html>
