<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | 探しています</title>
    <!-- 게시판 목록 공통 스타일 (見つけた 목록과 같이 사용) -->
    <link rel="stylesheet" th:href="@{/css/board-list.css}">
    <script th:src="@{/js/js-enabled.js}"></script>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 목록 스타일 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main class="board-section">
            <div class="board-title-area">
                <h2 class="board-title">探しています</h2>
                <span class="board-desc">なくした物を探している方の投稿です</span>
            </div>

            <!-- 이 게시판 안에서만 검색 (제목·본문). 헤더 검색창은 두 게시판 통합 검색 -->
            <!-- 지금 고른 노선·역·忘れ物 필터와 정렬은 그대로 두고 1페이지부터 보여준다 -->
            <div class="board-tools">
                <form id="boardSearch" class="board-search" th:action="@{/lost-items}" method="get" role="search"
                      th:data-clear-url="${query.keyword != null} ? ${query.withoutKeywordUrl()} : null">
                    <input type="hidden" name="line" th:value="${query.line}" th:if="${query.line != null}">
                    <input type="hidden" name="station" th:value="${query.station}" th:if="${query.station != null}">
                    <input type="hidden" name="category" th:value="${query.category}" th:if="${query.category != null}">
                    <input type="hidden" name="sort" th:value="${query.sort}" th:if="${query.sort != 'reg_desc'}">
                    <input type="text" id="boardKeyword" name="q" maxlength="100" placeholder="この掲示板内を検索（タイトル・本文）"
                           aria-label="探しています 掲示板内を検索" th:value="${currentKeyword}">
                    <button type="submit" class="board-search-btn" aria-label="この掲示板内を検索" title="この掲示板内を検索">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"></path></svg>
                    </button>
                </form>
            </div>

            <!-- 검색어로 찾은 경우 (게시판 안 검색창, 또는 헤더 검색 → 통합 검색 → 「すべて見る」) -->
            <div class="keyword-bar" th:if="${currentKeyword != null}">
                <span>「<b th:text="${currentKeyword}">キーワード</b>」の検索結果 <span th:text="${totalItems}">0</span>件<span class="keyword-warn" th:if="${keywordTruncated}"> (キーワードは5語までです。最初の5語で検索しています。)</span></span>
                <a class="keyword-clear" th:href="${query.withoutKeywordUrl()}">検索をやめる</a>
            </div>

            <!-- 노선·역·忘れ物 필터 (표 머리글의 선택 칸이 form 속성으로 이 폼에 들어간다) -->
            <form id="filterForm" th:action="@{/lost-items}" method="get">
                <input type="hidden" name="q" th:value="${currentKeyword}" th:if="${currentKeyword != null}">
                <input type="hidden" name="sort" th:value="${query.sort}" th:if="${query.sort != 'reg_desc'}">
            </form>

            <table class="lost-table">
                <caption class="visually-hidden">探しています 投稿一覧</caption>
                <colgroup>
                    <col class="col-date"> <col class="col-line"> <col class="col-station"> <col> <col class="col-author"> <col class="col-reg">
                </colgroup>
                <thead>
                    <tr>
                        <th id="header-date" th:classappend="${query.isSortedBy('date')} ? (${query.ascending} ? 'sort-active sort-asc' : 'sort-active')"
                            th:aria-sort="${query.ariaSort('date')}">
                            <a class="sort-link" th:href="${query.sortUrl('date')}">
                                <span>なくした日</span>
                                <svg class="sort-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16L6 10H18L12 16Z"></path></svg>
                            </a>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <label for="lineFilter">路線</label>
                                <select class="filter-select" id="lineFilter" name="line" form="filterForm">
                                    <option value="">すべて</option>
                                    <option th:each="line : ${lines}" th:value="${line}" th:text="${line}" th:selected="${line == query.line}"
                                            th:hidden="${query.station != null and stationLines.containsKey(query.station) and !#arrays.contains(#strings.arraySplit(stationLines.get(query.station), ','), line)}"></option>
                                </select>
                            </div>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <label for="stationFilter">駅</label>
                                <!-- data-lines: 그 역을 지나는 노선. 노선을 고르면 그 노선의 역만 보인다 (board-list.js, JS 가 없으면 서버가 고른 노선 기준으로) -->
                                <select class="filter-select" id="stationFilter" name="station" form="filterForm">
                                    <option value="">すべて</option>
                                    <option th:each="entry : ${stationLines}" th:value="${entry.key}" th:text="${entry.key}" th:data-lines="${entry.value}"
                                            th:selected="${entry.key == query.station}"
                                            th:hidden="${query.line != null and !#arrays.contains(#strings.arraySplit(entry.value, ','), query.line)}"></option>
                                    <!-- 역을 모르고 쓴 글만 보기 (LostItemForm.UNKNOWN_STATION) -->
                                    <option value="unknown" th:selected="${query.station == 'unknown'}">駅不明</option>
                                </select>
                            </div>
                        </th>
                        <th class="th-filter">
                            <div class="filter-box">
                                <label for="categoryFilter">忘れ物</label>
                                <select class="filter-select" id="categoryFilter" name="category" form="filterForm">
                                    <option value="">すべて</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.categoryName}" th:text="${cat.categoryName}"
                                            th:selected="${cat.categoryName == query.category}"></option>
                                </select>
                                <button type="submit" class="filter-apply" form="filterForm">絞り込む</button>
                            </div>
                        </th>
                        <th>作成者</th>
                        <th id="header-reg" th:classappend="${query.isSortedBy('reg')} ? (${query.ascending} ? 'sort-active sort-asc' : 'sort-active')"
                            th:aria-sort="${query.ariaSort('reg')}">
                            <a class="sort-link" th:href="${query.sortUrl('reg')}">
                                <span>作成日</span>
                                <svg class="sort-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16L6 10H18L12 16Z"></path></svg>
                            </a>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${items.isEmpty()}" class="empty-row">
                        <td colspan="6">
                            <!-- 검색어나 필터로 거른 결과가 0건이면 「条件に一致する」 -->
                            <th:block th:unless="${query.filtered}">登録されている投稿はありません。</th:block>
                            <th:block th:if="${query.filtered}">条件に一致する投稿はありません。</th:block>
                        </td>
                    </tr>

                    <!-- 물건 이름이 상세 화면 링크 (줄 전체로 넓혀서 어디를 눌러도 이동) -->
                    <tr th:each="item : ${items}" th:classappend="${item.resolved} ? 'row-resolved'">
                        <td class="td-center" th:text="${item.lostDate}" th:title="${item.lostDate}"></td>
                        <td th:text="${item.lineName}" th:title="${item.lineName}"></td>
                        <td th:if="${item.stationName != null}" th:text="${item.stationName}" th:title="${item.stationName}"></td>
                        <td th:unless="${item.stationName != null}" class="station-unknown">不明</td>
                        <td>
                            <span class="badge-resolved" th:if="${item.resolved}">見つかりました</span>
                            <span class="item-category" th:text="${item.categoryName}"></span><span class="item-sep" aria-hidden="true">|</span>
                            <a class="row-link" th:href="@{/lost-items/{id}(id=${item.id})}" th:text="${item.itemName}" th:title="${item.itemName}"></a>
                            <span class="comment-count" th:if="${item.commentCount > 0}" th:text="|[${item.commentCount}]|"
                                  th:aria-label="|コメント${item.commentCount}件|" title="コメント数"></span>
                        </td>
                        <td class="td-center" th:text="${item.author}" th:title="${item.author}"></td>
                        <td class="td-center" th:text="${#temporals.format(item.registrationDate, 'yyyy-MM-dd')}" th:title="${#temporals.format(item.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>

            <!-- 페이지 번호: 처음·끝과 지금 페이지 앞뒤 2쪽만 (나머지는 「…」) -->
            <nav class="pager" th:if="${totalPages > 0}" aria-label="ページ">
                <a th:if="${currentPage > 1}" th:href="${query.pageUrl(currentPage - 1)}" aria-label="前のページ">&lt;</a>
                <span th:unless="${currentPage > 1}" class="pager-disabled" aria-hidden="true">&lt;</span>
                <th:block th:each="pageNum : ${pageNumbers}">
                    <span th:if="${pageNum == null}" aria-hidden="true">…</span>
                    <span th:if="${pageNum != null and pageNum == currentPage}" class="page-num active" aria-current="page" th:text="${pageNum}"></span>
                    <a th:if="${pageNum != null and pageNum != currentPage}" class="page-num" th:href="${query.pageUrl(pageNum)}"
                       th:text="${pageNum}" th:aria-label="|${pageNum}ページ|"></a>
                </th:block>
                <a th:if="${currentPage < totalPages}" th:href="${query.pageUrl(currentPage + 1)}" aria-label="次のページ">&gt;</a>
                <span th:unless="${currentPage < totalPages}" class="pager-disabled" aria-hidden="true">&gt;</span>
            </nav>
        </main>

        <aside class="side-section">
            <div class="sidebar-card">
                <p>忘れ物をお探しですか？</p>
                <p class="sidebar-note" th:if="${loginMember == null}">投稿にはログインが必要です。</p>
                <a th:href="@{/lost-items/new}" class="write-btn-link">投稿する</a>
            </div>
            <div class="sidebar-card">
                <p>忘れ物を見つけましたか？</p>
                <a th:href="@{/items}" class="write-btn-link btn-gray">見つけた 掲示板</a>
            </div>
        </aside>
    </div>

    <!-- 필터 선택지 좁히기, 마우스로 고르면 바로 적용, 빈 검색어 처리 (없어도 링크·폼으로 동작한다) -->
    <script th:src="@{/js/board-list.js}"></script>
</body>
</html>
