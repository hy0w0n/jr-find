<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JR-Find | 詳細</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }

        .container { width: 90%; max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; align-items: flex-start; }
        .content-section { flex: 3; }
        .side-section { flex: 1; margin-top: 60px; }

        /* 제목·작성자 (見つけた 상세 화면과 같은 모양) */
        .post-header { border-top: 2px solid #555; border-bottom: 1px solid #ccc; }
        .post-title-row { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #555; }
        .board-label { font-size: 14px; padding-right: 15px; margin-right: 15px; border-right: 1px solid #ccc; white-space: nowrap; }
        .post-title-text { font-weight: bold; font-size: 16px; }
        .post-meta-bar { background-color: #f2f2f2; padding: 8px 15px; display: flex; justify-content: space-between; font-size: 13px; color: #666; }

        .badge { display: inline-block; margin-right: 10px; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge-searching { background: #fff4e5; color: #c05621; }
        .badge-resolved { background: #e8f5e9; color: #2e7d32; }

        /* 잃어버린 물건 요약 */
        .info-table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 14px; }
        .info-table th { width: 140px; padding: 10px 15px; text-align: left; background: #fafafa; color: #666; font-weight: normal; border-bottom: 1px solid #eee; }
        .info-table td { padding: 10px 15px; border-bottom: 1px solid #eee; }
        .station-unknown { color: #999; }

        .post-body { padding: 30px 10px 40px; min-height: 200px; border-bottom: 1px solid #eee; }
        .post-text { white-space: pre-wrap; line-height: 1.8; font-size: 15px; margin-bottom: 30px; }
        .post-image-area { text-align: center; margin-top: 20px; }
        .post-image { max-width: 100%; max-height: 500px; border-radius: 4px; border: 1px solid #eee; }

        /* 버튼 */
        .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-list-wrapper { display: inline-flex; align-items: center; background-color: #777; color: #fff; text-decoration: none; border-radius: 2px; transition: background 0.2s; height: 40px; }
        .btn-list-wrapper:hover { background-color: #555; }
        .btn-list-icon { padding: 0 12px; display: flex; align-items: center; }
        .btn-list-divider { width: 1px; height: 60%; background-color: #999; }
        .btn-list-text { padding: 0 20px 0 15px; font-weight: bold; font-size: 14px; }
        .list-svg { width: 20px; height: 20px; fill: #fff; }

        .right-btns { display: flex; gap: 10px; }
        .right-btns form { display: inline; }
        .btn-action { display: inline-flex; align-items: center; gap: 6px; background-color: #e5e5e5; color: #444; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; font-weight: bold; font-family: inherit; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .btn-action:hover { background-color: #d0d0d0; }
        .btn-resolve { background-color: #e8f5e9; color: #2e7d32; }
        .btn-resolve:hover { background-color: #d5ecd7; }
        .action-svg { width: 18px; height: 18px; fill: currentColor; }

        /* 사이드바 */
        .sidebar-card { border: 1px solid #ddd; border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 25px; background: #fff; }
        .sidebar-card p { font-size: 15px; color: #444; margin-bottom: 20px; }
        .write-btn-link { display: block; width: 100%; padding: 12px; background-color: #f0f0f0; color: #e63946; text-decoration: none; font-weight: bold; border-radius: 6px; transition: background 0.2s; }
        .write-btn-link:hover { background-color: #e5e5e5; }
        .btn-gray { background-color: #f0f0f0; color: #333; }
        .notice-card { border: 1px solid #f5c2c7; background-color: #fff5f5; border-radius: 15px; padding: 25px 20px; font-size: 13px; line-height: 1.7; color: #842029; }
        .notice-title { font-size: 15px; font-weight: bold; text-align: center; margin-bottom: 12px; }

        /* 삭제 확인 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: white; width: 400px; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; }
        .modal-icon-svg { width: 60px; height: 60px; fill: #ff4d4d; margin-bottom: 20px; }
        .modal-title-text { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .modal-desc-text { font-size: 14px; color: #999; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn-group { display: flex; width: 100%; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .modal-btn-cancel { background-color: #e0e0e0; color: #333; }
        .modal-btn-cancel:hover { background-color: #d0d0d0; }
        .modal-btn-delete { background-color: rgb(255, 128, 128); color: white; }
        .modal-btn-delete:hover { background-color: #ff4d4d; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main class="content-section">
            <div class="post-header">
                <div class="post-title-row">
                    <span class="board-label">探しています 掲示板</span>
                    <span class="badge badge-resolved" th:if="${item.resolved}">見つかりました</span>
                    <span class="badge badge-searching" th:unless="${item.resolved}">探しています</span>
                    <span class="post-title-text" th:text="${item.title}"></span>
                </div>
                <div class="post-meta-bar">
                    <span th:text="${item.author}"></span>
                    <div>
                        <span th:text="${#temporals.format(item.registrationDate, 'yyyy.MM.dd HH:mm')}"></span>
                        <span th:if="${item.modifiedDate != null}" style="color: #999; margin-left: 5px; font-size: 12px;">(編集済み)</span>
                    </div>
                </div>
            </div>

            <table class="info-table">
                <tr>
                    <th>なくした日</th>
                    <td th:text="${item.lostDate}"></td>
                </tr>
                <tr>
                    <th>なくした場所</th>
                    <td>
                        <span th:text="${item.lineName}"></span> /
                        <span th:if="${item.stationName != null}" th:text="${item.stationName}"></span>
                        <span th:unless="${item.stationName != null}" class="station-unknown">駅は不明</span>
                    </td>
                </tr>
                <tr>
                    <th>なくした物</th>
                    <td><span th:text="${item.categoryName}"></span> / <b th:text="${item.itemName}"></b></td>
                </tr>
            </table>

            <div class="post-body">
                <div class="post-text" th:text="${item.contents}"></div>
                <div class="post-image-area" th:if="${item.imgPath != null}">
                    <img th:src="|/images/${item.imgPath}|" class="post-image" alt="Uploaded Image">
                </div>
            </div>

            <div class="btn-group">
                <a th:href="@{/lost-items}" class="btn-list-wrapper">
                    <div class="btn-list-icon">
                        <svg class="list-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 4H21V6H8V4ZM3 3.5H6V6.5H3V3.5ZM3 10.5H6V13.5H3V10.5ZM3 17.5H6V20.5H3V17.5ZM8 11H21V13H8V11ZM8 18H21V20H8V18Z"></path></svg>
                    </div>
                    <div class="btn-list-divider"></div>
                    <div class="btn-list-text">一覧</div>
                </a>

                <!-- 작성자 본인에게만 표시 (권한은 서버에서도 다시 확인) -->
                <div class="right-btns" th:if="${isOwner}">
                    <form th:action="@{/lost-items/{id}/resolve(id=${item.id})}" method="post">
                        <input type="hidden" name="resolved" th:value="${!item.resolved}">
                        <button type="submit" class="btn-action btn-resolve" th:text="${item.resolved} ? '探している状態に戻す' : '見つかりました！'">見つかりました！</button>
                    </form>

                    <a th:href="@{/lost-items/{id}/edit(id=${item.id})}" class="btn-action">
                        <svg class="action-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.41421 15.89L16.5563 5.74785L15.1421 4.33363L5 14.4758V15.89H6.41421ZM7.24264 17.89H3V13.6473L14.435 2.21231C14.8256 1.82179 15.4587 1.82179 15.8492 2.21231L18.6777 5.04074C19.0682 5.43126 19.0682 6.06443 18.6777 6.45495L7.24264 17.89ZM3 19.89H21V21.89H3V19.89Z"></path></svg>
                        編集
                    </a>

                    <button type="button" class="btn-action" onclick="openDeleteModal()">
                        <svg class="action-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path></svg>
                        削除
                    </button>
                </div>
            </div>

            <!-- 댓글 (fragments/comments.html) -->
            <section th:replace="~{fragments/comments :: commentSection(|/lost-items/${item.id}|, ${item.memberId})}"></section>
        </main>

        <aside class="side-section">
            <div class="sidebar-card">
                <p>忘れ物をお探しですか？</p>
                <a th:href="@{/lost-items/new}" class="write-btn-link">投稿する</a>
            </div>
            <div class="sidebar-card">
                <p>忘れ物を拾われましたか？</p>
                <a th:href="@{/items}" class="write-btn-link btn-gray">見つけた 掲示板</a>
            </div>
            <div class="notice-card">
                <div class="notice-title">ご注意ください</div>
                忘れ物の受け取りは、駅の忘れ物取扱所または警察を通して行ってください。<br>
                個人間での直接の受け渡しや、お礼・手数料などの金銭の要求には応じないでください。
            </div>
            <!-- お忘れ物 문의처 (fragments/lostCenter.html) -->
            <div style="margin-top: 25px;">
                <div th:replace="~{fragments/lostCenter :: lostCenterInfo}"></div>
            </div>
        </aside>
    </div>

    <div id="deleteModal" class="modal-overlay" th:if="${isOwner}">
        <div class="modal-box">
            <svg class="modal-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"></path>
            </svg>
            <div class="modal-title-text">削除の確認</div>
            <div class="modal-desc-text">本当に削除しますか？<br>削除されたデータは復元できません。</div>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">キャンセル</button>
                <button class="modal-btn modal-btn-delete" onclick="document.getElementById('deleteForm').submit()">削除する</button>
            </div>
        </div>
    </div>
    <form id="deleteForm" th:if="${isOwner}" th:action="@{/lost-items/{id}/delete(id=${item.id})}" method="post" style="display: none;"></form>

    <script>
        function openDeleteModal() {
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }
    </script>
</body>
</html>
