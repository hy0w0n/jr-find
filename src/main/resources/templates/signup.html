<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | 会員登録</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; }

        /* 헤더 및 버튼 (등록 화면과 같은 스타일) */
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .action-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }
        .btn { padding: 8px 25px; border-radius: 20px; border: 1px solid #ccc; cursor: pointer; font-size: 14px; font-family: inherit; text-decoration: none; color: #333; background: #f0f0f0; transition: all 0.2s; }
        .btn-submit { color: #e63946; font-weight: bold; }
        .btn:hover { background: #e5e5e5; }

        /* 폼 공통 레이아웃 */
        .form-row { display: flex; border-bottom: 1px solid #eee; align-items: center; min-height: 70px; }
        .form-label { width: 180px; padding: 20px; font-weight: bold; }
        .form-label .optional { font-size: 12px; font-weight: normal; color: #666; }
        .form-input { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 6px; }

        input[type="text"], input[type="password"], input[type="date"], input[type="tel"] { width: 280px; padding: 10px; border: 1px solid #333; border-radius: 4px; font-family: inherit; }
        input:focus-visible { outline: 3px solid #1a73e8; outline-offset: 1px; }
        .input-error { border-color: #e63946 !important; }
        .field-note { font-size: 12px; color: #666; }
        .field-error { font-size: 13px; color: #c62828; }

        /* 개인정보 동의 */
        .agree-box { margin-top: 25px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; font-size: 13px; line-height: 1.7; }
        .agree-box h3 { font-size: 14px; margin-bottom: 8px; }
        .agree-check { display: flex; align-items: center; gap: 8px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <main id="main" class="container">
        <div class="form-header">
            <h1 style="font-size: 24px;">会員登録</h1>
        </div>

        <!-- 서버 검증에서 걸리면 입력값을 유지한 채 항목별 에러 메시지를 보여준다 -->
        <form id="signupForm" th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
            <div class="form-row">
                <label class="form-label" for="loginId">ID</label>
                <div class="form-input">
                    <input type="text" th:field="*{loginId}" maxlength="20" autocomplete="username" th:errorclass="input-error" th:aria-describedby="${#fields.hasErrors('loginId')} ? 'loginId-note loginId-error' : 'loginId-note'" th:aria-invalid="${#fields.hasErrors('loginId')} ? 'true' : null">
                    <span class="field-note" id="loginId-note">半角英数字と _ (4〜20文字)</span>
                    <span class="field-error" id="loginId-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></span>
                </div>
            </div>

            <!-- 비밀번호는 에러가 나도 다시 채워 넣지 않는다 -->
            <div class="form-row">
                <label class="form-label" for="password">パスワード</label>
                <div class="form-input">
                    <input type="password" id="password" name="password" maxlength="64" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'input-error'" th:aria-describedby="${#fields.hasErrors('password')} ? 'password-note password-error' : 'password-note'" th:aria-invalid="${#fields.hasErrors('password')} ? 'true' : null">
                    <span class="field-note" id="password-note">英字と数字を含む8〜64文字(半角)</span>
                    <span class="field-error" id="password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="passwordConfirm">パスワード確認</label>
                <div class="form-input">
                    <input type="password" id="passwordConfirm" name="passwordConfirm" maxlength="64" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'input-error'" th:aria-describedby="${#fields.hasErrors('passwordConfirm')} ? 'passwordConfirm-error' : null" th:aria-invalid="${#fields.hasErrors('passwordConfirm')} ? 'true' : null">
                    <span class="field-error" id="passwordConfirm-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="realName">氏名</label>
                <div class="form-input">
                    <input type="text" th:field="*{realName}" maxlength="20" autocomplete="name" th:errorclass="input-error" th:aria-describedby="${#fields.hasErrors('realName')} ? 'realName-error' : null" th:aria-invalid="${#fields.hasErrors('realName')} ? 'true' : null">
                    <span class="field-error" id="realName-error" th:if="${#fields.hasErrors('realName')}" th:errors="*{realName}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="nickname">ニックネーム <span class="optional">(任意)</span></label>
                <div class="form-input">
                    <input type="text" th:field="*{nickname}" maxlength="20" th:errorclass="input-error" th:aria-describedby="${#fields.hasErrors('nickname')} ? 'nickname-note nickname-error' : 'nickname-note'" th:aria-invalid="${#fields.hasErrors('nickname')} ? 'true' : null">
                    <span class="field-note" id="nickname-note">投稿者名として表示されます。未入力の場合は氏名が表示されます。</span>
                    <span class="field-error" id="nickname-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="birthDate">生年月日</label>
                <div class="form-input">
                    <input type="date" th:field="*{birthDate}" id="birthDate" min="1900-01-01" th:errorclass="input-error" th:aria-describedby="${#fields.hasErrors('birthDate')} ? 'birthDate-error' : null" th:aria-invalid="${#fields.hasErrors('birthDate')} ? 'true' : null">
                    <span class="field-error" id="birthDate-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label" for="phone">電話番号</label>
                <div class="form-input">
                    <input type="tel" th:field="*{phone}" maxlength="13" placeholder="090-1234-5678" autocomplete="tel" th:errorclass="input-error" th:aria-describedby="${#fields.hasErrors('phone')} ? 'phone-error' : null" th:aria-invalid="${#fields.hasErrors('phone')} ? 'true' : null">
                    <span class="field-error" id="phone-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>
            </div>

            <div class="agree-box">
                <h3>個人情報の取り扱いについて</h3>
                <p>
                    ご入力いただいた氏名・生年月日・電話番号は、会員管理および本人確認のためにのみ利用し、法令に基づく場合を除き第三者に提供しません。<br>
                    ニックネーム(未入力の場合は氏名)は、投稿者名として他の利用者に公開されます。
                </p>
                <label class="agree-check">
                    <input type="checkbox" th:field="*{agree}" id="agree" th:aria-describedby="${#fields.hasErrors('agree')} ? 'agree-error' : null" th:aria-invalid="${#fields.hasErrors('agree')} ? 'true' : null">
                    個人情報の取り扱いに同意します
                </label>
                <span class="field-error" id="agree-error" th:if="${#fields.hasErrors('agree')}" th:errors="*{agree}"></span>
            </div>

            <div class="action-btns">
                <a th:href="@{/}" class="btn">キャンセル</a>
                <button type="submit" class="btn btn-submit">登録</button>
            </div>
        </form>
    </main>

    <!-- 오류 칸으로 포커스, 생년월일 상한, 탈퇴 확인, 로그인 빈 칸 안내 -->
    <script th:src="@{/js/member-form.js}"></script>
</body>
</html>
