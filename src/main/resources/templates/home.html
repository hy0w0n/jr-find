<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | Home</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; height: 100vh; display: flex; flex-direction: column; }

        /* 상단 네비게이션 (우측 정렬) */
        .top-nav { display: flex; justify-content: flex-end; align-items: center; padding: 20px 5%; gap: 20px; }
        .nav-icon { 
			width: 45px;         /* 원의 가로 크기 */
		    height: 45px;        /* 원의 세로 크기 */
		    border: 1px solid #333; /* 검정색 테두리 */
		    border-radius: 50%;  /* 테두리를 원형으로 만듦 */
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    padding: 8px;        /* 아이콘과 테두리 사이의 간격 */
		    transition: all 0.2s;
		}
        .nav-icon:hover { background-color: #f0f0f0; }
        .nav-icon { color: #333; }
		.nav-icon svg {width: 24px; height: 24px;}

        /* 중앙 메인 콘텐츠 */
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10vh; }
        
        .notice { margin-bottom: 30px; padding: 12px 25px; border-radius: 6px; font-size: 14px; background: #e8f5e9; color: #2e7d32; }
        .notice-warn { background: #fff8e1; color: #7a5b00; }

        /* 로고 영역 (화면의 제목 h1) */
        .main-logo-title { margin: 0; width: 100%; display: flex; justify-content: center; font-size: inherit; }
		.main-logo { 
            width: 400px; 
            margin-bottom: 30px; /* 간격 조금 줄임 */
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .main-logo img {
            width: 100%;
            height: auto; /* 비율 유지 */
            /* filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));  원한다면 그림자 추가 */
        }

        /* 검색창 영역 */
        .search-wrapper { position: relative; width: 600px; margin-bottom: 40px; }
        .search-input { width: 100%; padding: 18px 60px 18px 30px; border-radius: 40px; border: 1px solid #333; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .search-input:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }
        .search-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; background: none; border: none; cursor: pointer; padding: 0; }

        /* 버튼 그룹 */
        .btn-group { display: flex; gap: 30px; }
        .action-btn { width: 220px; padding: 18px; border-radius: 15px; border: 1px solid #333; background: #fff; font-size: 18px; font-weight: bold; text-decoration: none; color: #333; text-align: center; transition: all 0.2s; }
        .action-btn:hover { background: #333; color: #fff; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>

    <header class="top-nav">
        <a th:href="@{/map}" class="nav-icon" title="駅マップ" aria-label="駅マップ">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.8995L16.9497 15.9497C19.6834 13.2161 19.6834 8.78392 16.9497 6.05025C14.2161 3.31658 9.78392 3.31658 7.05025 6.05025C4.31658 8.78392 4.31658 13.2161 7.05025 15.9497L12 20.8995ZM12 23.7279L5.63604 17.364C2.12132 13.8492 2.12132 8.15076 5.63604 4.63604C9.15076 1.12132 14.8492 1.12132 18.364 4.63604C21.8787 8.15076 21.8787 13.8492 18.364 17.364L12 23.7279ZM12 13C13.1046 13 14 12.1046 14 11C14 9.89543 13.1046 9 12 9C10.8954 9 10 9.89543 10 11C10 12.1046 10.8954 13 12 13ZM12 15C9.79086 15 8 13.2091 8 11C8 8.79086 9.79086 7 12 7C14.2091 7 16 8.79086 16 11C16 13.2091 14.2091 15 12 15Z"></path></svg>
        </a>
        <div th:replace="~{fragments/header :: authMenu}"></div>
    </header>

    <main id="main" class="main-container">
        <!-- 탈퇴 직후 (MyPageController), 다른 기기에서 탈퇴해 이 브라우저의 로그인이 끝난 경우 (SecurityConfig) -->
        <div class="notice" th:if="${param.withdrawn}">退会が完了しました。ご利用ありがとうございました。</div>
        <div class="notice" th:if="${param.logout}">ログアウトしました。</div>
        <!-- 폼을 오래 열어 둬서 보내지 못하고 돌아갈 화면을 알 수 없는 경우 (ExpiredFormHandler) -->
        <div class="notice notice-warn" th:if="${param.expired}">時間が経過したため、送信できませんでした。お手数ですが、もう一度お試しください。</div>
		<h1 class="main-logo-title">
			<a th:href="@{/}" class="main-logo">
				<img th:src="@{/logo/logo3_1.png}" width="800" height="274" alt="JRで探す">
			</a>
		</h1>

        <!-- 통합 검색 (두 게시판의 제목·본문). 빈 칸이면 보내지 않는다 -->
        <form class="search-wrapper" th:action="@{/search}" method="get" role="search" data-site-search>
            <input type="text" name="q" class="search-input" maxlength="100" placeholder="何をお探しですか？" aria-label="検索">
            <button type="submit" class="search-btn" title="検索" aria-label="検索">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"></path></svg>
            </button>
        </form>

        <div class="btn-group">
            <a th:href="@{/items}" class="action-btn">見つけた！</a>
            <a th:href="@{/lost-items}" class="action-btn">探しています</a>
        </div>
    </main>

</body>
</html>
