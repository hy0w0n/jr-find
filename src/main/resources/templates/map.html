<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-Find | 駅マップ</title>
    <!-- 지도: Leaflet + OpenStreetMap (API 키 불필요) -->
    <link rel="stylesheet" th:href="@{/webjars/leaflet/dist/leaflet.css}">
    <script th:src="@{/js/js-enabled.js}"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; align-items: flex-start; }
        .map-section { flex: 3; min-width: 0; }
        .side-section { flex: 1; min-width: 260px; margin-top: 60px; display: flex; flex-direction: column; gap: 25px; }

        .map-title-area { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .map-title { font-size: 24px; }
        .map-desc { font-size: 13px; color: #666; }

        /* z-index: 0 으로 Leaflet 의 컨트롤이 고정 헤더 위로 올라오지 않게 한다 */
        #map { position: relative; z-index: 0; height: 600px; border: 1px solid #ddd; border-radius: 8px; }

        /* 노선도 범례 (체크하면 노선을 표시) */
        .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: #555; }
        .legend-title { font-weight: bold; color: #333; }
        .legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .legend-swatch { display: inline-block; width: 22px; height: 5px; border-radius: 3px; }
        .legend-fit { margin-left: auto; padding: 5px 14px; border: 1px solid #949494; border-radius: 15px; background: #fff; font-size: 12px; font-family: inherit; color: #555; cursor: pointer; }
        .legend-fit:hover { background: #f5f5f5; }
        .marker-legend { display: inline-flex; align-items: center; gap: 6px; }
        .marker-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #333; }

        /* 선택한 역 */
        .station-panel { border: 1px solid #ddd; border-radius: 12px; padding: 25px 20px; }
        .station-panel-hint { font-size: 14px; color: #666; line-height: 1.7; text-align: center; }
        .station-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .line-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .line-chip { padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #333; border-left: 6px solid; background: #f5f5f5; }
        .station-links { display: flex; flex-direction: column; gap: 8px; }
        .station-link { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 6px; background: #f0f0f0; color: #333; text-decoration: none; font-size: 14px; font-weight: bold; transition: background 0.2s; }
        .station-link:hover { background: #e5e5e5; }
        .station-link b { color: #c62828; }
        .lost-center-flag { margin-top: 12px; font-size: 12px; color: #198754; line-height: 1.5; }
        .map-error { color: #c62828; font-size: 14px; text-align: center; }
        #map > .map-error { padding: 40px 20px; }
        /* 역 고르기 (키보드·스크린리더용, JS 가 없으면 게시판 목록으로 가는 폼) */
        .station-picker { border: 1px solid #ddd; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
        .station-picker label { font-size: 14px; font-weight: bold; }
        .station-picker select { padding: 8px; border: 1px solid #949494; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .station-picker-btns { display: flex; gap: 8px; }
        .station-picker-btns button { flex: 1; padding: 8px; border: 1px solid #949494; border-radius: 6px; background: #f0f0f0; font-size: 13px; font-family: inherit; cursor: pointer; }
        .js .station-picker-btns { display: none; } /* JS 가 있으면 고르는 즉시 아래 패널에 두 게시판의 글 수와 링크가 나온다 */
        .station-picker select:focus-visible, .station-picker-btns button:focus-visible, .legend-fit:focus-visible { outline: 3px solid #1a73e8; outline-offset: 1px; }
    </style>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 이 화면의 <style> 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main id="main" class="map-section">
            <div class="map-title-area">
                <h1 class="map-title">駅マップ</h1>
                <span class="map-desc">駅をクリックすると、その駅の投稿を確認できます</span>
            </div>

            <div id="map">
                <noscript><p class="map-error">地図を表示するには JavaScript を有効にしてください。右の「駅を選ぶ」から駅の投稿を確認できます。</p></noscript>
            </div>

            <div class="legend" id="legend">
                <span class="legend-title">路線図</span>
                <!-- 노선 체크박스는 데이터를 받은 뒤 JS 로 추가 -->
                <span class="marker-legend"><span class="marker-dot" aria-hidden="true" style="background: #e63946;"></span>投稿あり</span>
                <button type="button" class="legend-fit" id="fitAllBtn">全体を表示</button>
            </div>
        </main>

        <aside class="side-section">
            <!-- 역 고르기: 지도의 역을 마우스로 누르지 않아도 (키보드·스크린리더) 같은 정보를 볼 수 있게 -->
            <form class="station-picker" th:action="@{/items}" method="get">
                <label for="stationPicker">駅を選ぶ</label>
                <select id="stationPicker" name="station">
                    <option value="">駅を選択</option>
                    <optgroup th:each="line : ${lines}" th:label="${line.name()}">
                        <option th:each="name : ${line.stations()}" th:value="${name}" th:text="${name}"></option>
                    </optgroup>
                </select>
                <div class="station-picker-btns">
                    <button type="submit">見つけた を見る</button>
                    <button type="submit" th:formaction="@{/lost-items}">探しています を見る</button>
                </div>
            </form>
            <!-- 고른 역: 바뀌면 스크린리더가 읽는다 -->
            <div class="station-panel" id="stationPanel" aria-live="polite">
                <p class="station-panel-hint">地図の駅をクリックしてください。<br>その駅で見つかった物・探している物の投稿を表示します。</p>
            </div>
            <div th:replace="~{fragments/lostCenter :: lostCenterInfo}"></div>
        </aside>
    </div>

    <script th:src="@{/webjars/leaflet/dist/leaflet.js}"></script>
    <!-- 지도·노선도 그리기, 역 고르기 -->
    <script th:src="@{/js/map.js}"></script>
</body>
</html>
