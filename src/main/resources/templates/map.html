<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JR-Find | 駅マップ</title>
    <!-- 지도: Leaflet + OpenStreetMap (API 키 불필요) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fff; color: #333; }
        .container { width: 90%; max-width: 1200px; margin: 40px auto; display: flex; gap: 40px; align-items: flex-start; }
        .map-section { flex: 3; min-width: 0; }
        .side-section { flex: 1; min-width: 260px; margin-top: 60px; display: flex; flex-direction: column; gap: 25px; }

        .map-title-area { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .map-title { font-size: 24px; }
        .map-desc { font-size: 13px; color: #888; }

        /* z-index: 0 으로 Leaflet 의 컨트롤이 고정 헤더 위로 올라오지 않게 한다 */
        #map { position: relative; z-index: 0; height: 600px; border: 1px solid #ddd; border-radius: 8px; }

        /* 노선도 범례 (체크하면 노선을 표시) */
        .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: #555; }
        .legend-title { font-weight: bold; color: #333; }
        .legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .legend-swatch { display: inline-block; width: 22px; height: 5px; border-radius: 3px; }
        .legend-fit { margin-left: auto; padding: 5px 14px; border: 1px solid #ccc; border-radius: 15px; background: #fff; font-size: 12px; font-family: inherit; color: #555; cursor: pointer; }
        .legend-fit:hover { background: #f5f5f5; }
        .marker-legend { display: inline-flex; align-items: center; gap: 6px; }
        .marker-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #333; }

        /* 선택한 역 */
        .station-panel { border: 1px solid #ddd; border-radius: 12px; padding: 25px 20px; }
        .station-panel-hint { font-size: 14px; color: #888; line-height: 1.7; text-align: center; }
        .station-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .line-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .line-chip { padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #333; border-left: 6px solid; background: #f5f5f5; }
        .station-links { display: flex; flex-direction: column; gap: 8px; }
        .station-link { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 6px; background: #f0f0f0; color: #333; text-decoration: none; font-size: 14px; font-weight: bold; transition: background 0.2s; }
        .station-link:hover { background: #e5e5e5; }
        .station-link b { color: #e63946; }
        .lost-center-flag { margin-top: 12px; font-size: 12px; color: #198754; line-height: 1.5; }
        .map-error { color: #e63946; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main class="map-section">
            <div class="map-title-area">
                <h2 class="map-title">駅マップ</h2>
                <span class="map-desc">駅をクリックすると、その駅の投稿を確認できます</span>
            </div>

            <div id="map"></div>

            <div class="legend" id="legend">
                <span class="legend-title">路線図</span>
                <!-- 노선 체크박스는 데이터를 받은 뒤 JS 로 추가 -->
                <span class="marker-legend"><span class="marker-dot" style="background: #e63946;"></span>投稿あり</span>
                <button type="button" class="legend-fit" id="fitAllBtn">全体を表示</button>
            </div>
        </main>

        <aside class="side-section">
            <div class="station-panel" id="stationPanel">
                <p class="station-panel-hint">地図の駅をクリックしてください。<br>その駅で見つかった物・探している物の投稿を表示します。</p>
            </div>
            <div th:replace="~{fragments/lostCenter :: lostCenterInfo}"></div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script>
        // 노선 표시 색 (실제 노선 색에 가깝게 고른 값). 없는 노선은 회색
        const LINE_COLORS = {
            '山手線': '#80C241',
            '京浜東北線': '#00B2E5',
            '中央・総武緩行線': '#FFD400',
            '埼京線': '#00AC9A',
            '東海道線': '#F68B1E',
            '上野東京ライン': '#B5338A'
        };
        // 순환선: 마지막 역과 첫 역을 잇는다
        const LOOP_LINES = ['山手線'];
        const colorOf = line => LINE_COLORS[line] || '#888';

        const map = L.map('map').setView([35.70, 139.73], 11);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const panel = document.getElementById('stationPanel');
        let allPoints = [];
        let selected = null; // { marker, station }

        // 역 이름 등은 textContent 로 넣는다 (HTML 로 해석하지 않음)
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function markerStyle(station, isSelected) {
            const hasPosts = station.foundCount + station.lostCount > 0;
            return {
                radius: isSelected ? 10 : (hasPosts ? 8 : 6),
                color: isSelected ? '#e63946' : '#333',
                weight: isSelected ? 3 : 2,
                fillColor: hasPosts ? '#e63946' : '#fff',
                fillOpacity: 1
            };
        }

        function countLink(href, label, count) {
            const a = el('a', 'station-link');
            a.href = href;
            a.append(el('span', null, label));
            const right = el('span');
            right.append(el('b', null, String(count)), document.createTextNode(' 件'));
            a.append(right);
            return a;
        }

        function selectStation(station, marker) {
            if (selected) selected.marker.setStyle(markerStyle(selected.station, false));
            marker.setStyle(markerStyle(station, true));
            selected = { marker, station };

            panel.replaceChildren();
            panel.append(el('div', 'station-name', station.name + '駅'));

            const chips = el('div', 'line-chips');
            station.lines.forEach(line => {
                const chip = el('span', 'line-chip', line);
                chip.style.borderLeftColor = colorOf(line);
                chips.append(chip);
            });
            panel.append(chips);

            const links = el('div', 'station-links');
            const q = encodeURIComponent(station.name);
            links.append(countLink('/items?station=' + q, '見つけた', station.foundCount));
            links.append(countLink('/lost-items?station=' + q, '探しています', station.lostCount));
            panel.append(links);

            if (station.lostCenter) {
                panel.append(el('p', 'lost-center-flag', 'この駅にはJR東日本のお忘れ物承り所があります。受付時間は下の案内をご覧ください。'));
            }
        }

        function render(data) {
            const byName = new Map(data.stations.map(s => [s.name, s]));
            const legend = document.getElementById('legend');
            const markerLegend = legend.querySelector('.marker-legend');

            // 노선도: 노선 순서대로 역을 잇는다
            data.lines.forEach(line => {
                const points = line.stations.map(name => byName.get(name)).filter(Boolean).map(s => [s.lat, s.lng]);
                if (LOOP_LINES.includes(line.name) && points.length > 2) points.push(points[0]);
                // interactive: false → 선이 역 위에 겹쳐도 클릭은 역으로 간다
                const layer = L.polyline(points, { color: colorOf(line.name), weight: 5, opacity: 0.85, interactive: false }).addTo(map);

                const label = el('label');
                const checkbox = el('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.line = line.name;
                // 다시 켤 때는 역 아래에 그린다 (그냥 addTo 하면 맨 위에 그려져 역을 가린다)
                checkbox.addEventListener('change', () => checkbox.checked ? layer.addTo(map).bringToBack() : layer.remove());
                const swatch = el('span', 'legend-swatch');
                swatch.style.background = colorOf(line.name);
                label.append(checkbox, swatch, document.createTextNode(line.name));
                legend.insertBefore(label, markerLegend);
            });

            // 역 (노선 위에 그린다)
            data.stations.forEach(station => {
                const total = station.foundCount + station.lostCount;
                const marker = L.circleMarker([station.lat, station.lng], markerStyle(station, false)).addTo(map);
                marker.bindTooltip(el('span', null, total > 0 ? `${station.name} (${total}件)` : station.name),
                    { direction: 'top', offset: [0, -6] });
                marker.on('click', () => selectStation(station, marker));
                allPoints.push([station.lat, station.lng]);
            });
        }

        document.getElementById('fitAllBtn').addEventListener('click', () => {
            if (allPoints.length > 0) map.fitBounds(allPoints, { padding: [20, 20] });
        });

        fetch('/map/stations')
            .then(response => {
                if (!response.ok) throw new Error(response.status);
                return response.json();
            })
            .then(render)
            .catch(error => {
                console.error(error);
                panel.replaceChildren(el('p', 'map-error', '駅の情報を読み込めませんでした。'));
            });
    </script>
</body>
</html>
