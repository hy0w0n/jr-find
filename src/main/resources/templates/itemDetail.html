<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fetch 로 POST 할 때 헤더에 넣을 CSRF 토큰 (비회원 글 비밀번호 확인) -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${item.itemName} + ' | 見つけた | JR-Find'">JR-Find | 詳細</title>
    <!-- 상세 화면 공통 스타일 (探しています 상세와 같이 사용) -->
    <link rel="stylesheet" th:href="@{/css/post-detail.css}">
    <script th:src="@{/js/js-enabled.js}"></script>
    <!-- 휴대폰 화면(폭 768px 이하) 공통 스타일. 위 스타일 뒤에 두어서 같은 선택자는 이쪽이 우선 -->
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: mainHeader}"></div>

    <div class="container">
        <main class="content-section">

            <div class="post-header">
                <div class="post-title-row">
                    <span class="board-label">見つけた 掲示板</span>
                    <h1 class="post-title-text" th:text="${item.title}"></h1>
                </div>
                <div class="post-meta-bar">
                    <span th:text="${item.author}"></span>
                    <div>
                        <span th:text="${#temporals.format(item.registrationDate, 'yyyy.MM.dd HH:mm')}"></span>
                        <span class="edited-mark" th:if="${item.modifiedDate != null}">(編集済み)</span>
                    </div>
                </div>
            </div>

            <div class="post-body">
                <div class="post-text" th:text="${item.contents}">
                    내용이 들어갑니다.
                </div>

                <div class="post-image-area" th:if="${item.imgPath != null}">
                    <img th:src="|/images/${item.imgPath}|" class="post-image" th:alt="|${item.itemName}の写真|">
                </div>
            </div>

            <div class="btn-group">
                <a th:href="${listUrl}" class="btn-list-wrapper">
                    <span class="btn-list-icon">
                        <svg class="list-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 4H21V6H8V4ZM3 3.5H6V6.5H3V3.5ZM3 10.5H6V13.5H3V10.5ZM3 17.5H6V20.5H3V17.5ZM8 11H21V13H8V11ZM8 18H21V20H8V18Z"></path></svg>
                    </span>
                    <span class="btn-list-divider"></span>
                    <span class="btn-list-text">一覧</span>
                </a>

                <div class="right-btns">
                    <!-- 비회원 글: 4자리 비밀번호 확인 후 수정·삭제
                         (JS 가 있으면 화면 안의 창을 열고, 없으면 서버가 창을 연 화면을 돌려준다. js/post-detail.js) -->
                    <th:block th:if="${item.memberId == null}">
                    <a class="btn-action" th:href="@{/items/{id}(id=${item.id}, verify='edit')}" data-dialog="passwordModal" data-action="edit">
                        <svg class="action-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.41421 15.89L16.5563 5.74785L15.1421 4.33363L5 14.4758V15.89H6.41421ZM7.24264 17.89H3V13.6473L14.435 2.21231C14.8256 1.82179 15.4587 1.82179 15.8492 2.21231L18.6777 5.04074C19.0682 5.43126 19.0682 6.06443 18.6777 6.45495L7.24264 17.89ZM3 19.89H21V21.89H3V19.89Z"></path></svg>
                        編集
                    </a>
                    <a class="btn-action" th:href="@{/items/{id}(id=${item.id}, verify='delete')}" data-dialog="passwordModal" data-action="delete">
                        <svg class="action-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path></svg>
                        削除
                    </a>
                    </th:block>

                    <!-- 회원 글: 작성자 본인에게만 표시 (비밀번호 불필요. 권한은 서버에서도 다시 확인) -->
                    <th:block th:if="${isOwner}">
                    <a class="btn-action" th:href="@{/items/{id}/edit(id=${item.id})}">
                        <svg class="action-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.41421 15.89L16.5563 5.74785L15.1421 4.33363L5 14.4758V15.89H6.41421ZM7.24264 17.89H3V13.6473L14.435 2.21231C14.8256 1.82179 15.4587 1.82179 15.8492 2.21231L18.6777 5.04074C19.0682 5.43126 19.0682 6.06443 18.6777 6.45495L7.24264 17.89ZM3 19.89H21V21.89H3V19.89Z"></path></svg>
                        編集
                    </a>
                    <a class="btn-action" th:href="@{/items/{id}(id=${item.id}, confirmDelete='')}" data-dialog="deleteModal">
                        <svg class="action-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path></svg>
                        削除
                    </a>
                    </th:block>

                    <!-- 「シェア」: 이 글의 주소 복사 (JS 가 필요하므로 JS 가 꺼져 있으면 숨김) -->
                    <button type="button" class="btn-action js-only" id="shareButton">
                        <svg class="action-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13.1202 17.0228L8.92129 14.7324C8.19135 15.5125 7.15261 16 6 16C3.79086 16 2 14.2091 2 12C2 9.79086 3.79086 8 6 8C7.15255 8 8.19125 8.48746 8.92118 9.26746L13.1202 6.97713C13.0417 6.66441 13 6.33707 13 6C13 3.79086 14.7909 2 17 2C19.2091 2 21 3.79086 21 6C21 8.20914 19.2091 10 17 10C15.8474 10 14.8087 9.51251 14.0787 8.73246L9.87977 11.0228C9.9583 11.3355 10 11.6629 10 12C10 12.3371 9.95831 12.6644 9.87981 12.9771L14.0788 15.2675C14.8087 14.4875 15.8474 14 17 14C19.2091 14 21 15.7909 21 18C21 20.2091 19.2091 22 17 22C14.7909 22 13 20.2091 13 18C13 17.6629 13.0417 17.3355 13.1202 17.0228ZM6 14C7.10457 14 8 13.1046 8 12C8 10.8954 7.10457 10 6 10C4.89543 10 4 10.8954 4 12C4 13.1046 4.89543 14 6 14ZM17 8C18.1046 8 19 7.10457 19 6C19 4.89543 18.1046 4 17 4C15.8954 4 15 4.89543 15 6C15 7.10457 15.8954 8 17 8ZM17 20C18.1046 20 19 19.1046 19 18C19 16.8954 18.1046 16 17 16C15.8954 16 15 16.8954 15 18C15 19.1046 15.8954 20 17 20Z"></path></svg>
                        シェア
                    </button>
                </div>
            </div>

            <!-- 댓글 (fragments/comments.html) -->
            <section th:replace="~{fragments/comments :: commentSection(|/items/${item.id}|, ${item.memberId})}"></section>

        </main>

        <aside class="side-section">
            <div class="sidebar-card">
                <p>忘れ物を見つけましたか？</p>
                <a th:href="@{/items/new}" class="write-btn-link">投稿する</a>
            </div>
            <div class="sidebar-card">
                <p>忘れ物をお探しですか？</p>
                <a th:href="@{/lost-items}" class="write-btn-link btn-gray">探しています 掲示板</a>
            </div>

            <!-- お忘れ物 문의처 (fragments/lostCenter.html) -->
            <div th:replace="~{fragments/lostCenter :: lostCenterInfo}"></div>
        </aside>
    </div>

    <!-- 비회원 글의 비밀번호 확인 창
         JS 가 있으면 화면 안에서 확인하고(fetch → /check-password), 없으면 폼으로 보낸다(/verify → 결과 화면) -->
    <div id="passwordModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle" aria-describedby="pwModalDesc"
         th:if="${item.memberId == null}" th:classappend="${verifyAction != null} ? 'open'">
        <form class="modal-box" id="pwForm" method="post" th:action="@{/items/{id}/verify(id=${item.id})}"
              th:data-check-url="@{/items/{id}/check-password(id=${item.id})}" th:data-edit-url="@{/items/{id}/edit(id=${item.id})}"
              th:data-list-url="@{/items}">
            <svg class="modal-icon-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"></path></svg>
            <h2 class="modal-title-text" id="pwModalTitle">パスワード確認</h2>
            <!-- 수정을 보냈는데 비밀번호 확인이 풀려 있던 경우는 다른 설명 (입력한 내용은 보관돼 있다) -->
            <p class="modal-desc-text" id="pwModalDesc" th:text="${reverify} ? '保存する前に、もう一度パスワード(4桁)を入力してください。&#10;入力していた内容は、確認後の編集画面に戻します。' : '記事を作成した時のパスワード(4桁)を入力してください。'">記事を作成した時のパスワード(4桁)を入力してください。</p>
            <input type="hidden" name="action" id="pwAction" th:value="${verifyAction} ?: 'edit'">
            <label for="modalPasswordInput" class="visually-hidden">パスワード(半角数字4桁)</label>
            <input type="password" id="modalPasswordInput" name="password" class="modal-input-pw" maxlength="4" inputmode="numeric" autocomplete="off"
                   placeholder="●●●●" aria-describedby="modalErrorMsg" data-autofocus th:aria-invalid="${verifyError != null} ? 'true' : null">
            <!-- 오류 문구: 바뀌면 스크린리더가 바로 읽는다 -->
            <p id="modalErrorMsg" class="modal-error" aria-live="assertive" th:text="${verifyError}"></p>
            <div class="modal-btn-group">
                <a class="modal-btn modal-btn-cancel" th:href="@{/items/{id}(id=${item.id})}">キャンセル</a>
                <button type="submit" class="modal-btn modal-btn-ok">OK</button>
            </div>
        </form>
    </div>

    <!-- 삭제 확인 창 (회원 글의 작성자, 비밀번호를 확인한 비회원) -->
    <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" aria-describedby="deleteDesc"
         th:if="${item.memberId == null or isOwner}" th:classappend="${confirmDelete} ? 'open'">
        <form class="modal-box" method="post" th:action="@{/items/{id}/delete(id=${item.id})}">
            <svg class="modal-icon-svg modal-icon-danger" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"></path></svg>
            <h2 class="modal-title-text" id="deleteTitle">削除の確認</h2>
            <p class="modal-desc-text" id="deleteDesc">本当に削除しますか？
削除されたデータは復元できません。
この投稿に付いたコメントも表示されなくなります。</p>
            <div class="modal-btn-group">
                <a class="modal-btn modal-btn-cancel" th:href="@{/items/{id}(id=${item.id})}" data-autofocus>キャンセル</a>
                <button type="submit" class="modal-btn modal-btn-delete">削除する</button>
            </div>
        </form>
    </div>

    <script th:src="@{/js/dialog.js}"></script>
    <!-- 「シェア」: 이 글의 주소 복사 -->
    <script th:src="@{/js/share-link.js}"></script>
    <!-- 수정·삭제 창, 비밀번호 확인 -->
    <script th:src="@{/js/post-detail.js}"></script>
</body>
</html>
